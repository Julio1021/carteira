.hx-mini{padding:10px 12px 12px}
.hx-mini .hx-top{margin-bottom:10px}
.inicio .gp-ult .tx-l{margin-top:6px}
.pl-ls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl-l{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px;font:inherit;text-align:left;cursor:pointer}
.pl-l:hover{border-color:var(--accent)}
.pl-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.pl-t{min-width:0;display:flex;flex-direction:column;gap:2px} .pl-t b{font-size:14.5px} .pl-t small{font-size:12px;color:var(--muted)}
.pl-l>svg{color:var(--muted)}
:root[data-glass] .pl-l{background:var(--gl-glass2);border-color:var(--gl-bd)}

.pt-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding:2px}
.pt-nav::-webkit-scrollbar{display:none}
.pt-nav button{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
.pt-nav button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-glass] .pt-nav button:not([aria-current="page"]){background:var(--gl-glass2);border-color:var(--gl-bd)}

/* ================= SINCRONIZAÇÃO COM O GOOGLE DRIVE (app instalado e site do GitHub) ================= */
const GD_CLIENT = "";   // ID do cliente OAuth (Google Cloud) — preenchido na configuração

const GD_FILE = "carteira-sync.json";

const gdLer=(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } };

const gdCfg=()=>gdLer(GD_K.cfg,{on:false,last:0});
const gdTok=()=>{ const t=gdLer(GD_K.tok,null); return t&&t.exp>Date.now()+60000?t.t:null; };

function gdRedirectUri(){ return location.origin+location.pathname.replace(/index\.html$/,""); }
function gdEntrar(motivo){
  const q=new URLSearchParams({client_id:GD_CLIENT,redirect_uri:gdRedirectUri(),response_type:"token",scope:GD_SCOPE,include_granted_scopes:"true",state:motivo||"sync"});

}
function gdVoltaLogin(){ // trata o retorno do Google (#access_token=...)
  if(!/access_token=|error=/.test(location.hash)) return null;
  const h=new URLSearchParams(location.hash.slice(1)); history.replaceState(null,"",location.pathname+location.search);
  if(h.get("error")){ GD.erro=h.get("error")==="access_denied"?"Você não autorizou o acesso ao Drive.":"O Google recusou o login ("+h.get("error")+")."; return "erro"; }

  return h.get("state")||"sync";
}
async function gdApi(url,opt={}){
  const t=gdTok(); if(!t){ const e=new Error("sem_token"); e.code="sem_token"; throw e; }
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}});
  if(r.status===401){ gdGravar(GD_K.tok,null); const e=new Error("sem_token"); e.code="sem_token"; throw e; }
  if(!r.ok){ const e=new Error("http_"+r.status); e.code="http"; e.status=r.status; throw e; }
  return r;
}
async function gdBaixar(){
  const r=await gdApi(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent(`name='${GD_FILE}'`)}&fields=files(id,modifiedTime)`);
  const f=((await r.json()).files||[])[0]; if(!f) return {id:null,pk:null};
  const r2=await gdApi(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
  let pk=null; try{ pk=await r2.json(); }catch{} return {id:f.id,pk};
}
async function gdSubir(id,pk){
  const body=JSON.stringify(pk);
  if(id){ await gdApi(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body}); return id; }
  const b="gd"+Math.random().toString(16).slice(2), meta=JSON.stringify({name:GD_FILE,parents:["appDataFolder"]});

}
const gdDocsLocais=()=>bkDocs().filter(d=>d.kind!=="pref");
const gdTombs=()=>gdLer(GD_K.tomb,{});
/* junta dois lados: vale a versão mais nova de cada registro; apagado vence se for mais novo */
function gdJuntar(L,TL,R,TR,pref){
  const T={...TR}; Object.entries(TL).forEach(([k,v])=>{ if(!T[k]||v>T[k]) T[k]=v; });
  const lm=new Map(L.map(d=>[d.id,d])), rm=new Map(R.map(d=>[d.id,d])), out=new Map();
  new Set([...lm.keys(),...rm.keys()]).forEach(id=>{ const a=lm.get(id), b=rm.get(id); let d;
    if(a&&b) d=(b._u||0)>(a._u||0)?b:(a._u||0)>(b._u||0)?a:(pref==="drive"?b:a); else d=a||b;
    if(T[id]&&T[id]>=(d._u||0)) return; out.set(id,d); });
  const lim=Date.now()-120*864e5; Object.keys(T).forEach(k=>{ if(T[k]<lim) delete T[k]; });
  return {docs:[...out.values()],tomb:T};
}
async function gdSync(op={}){
  if(!gdDisponivel()||GD.rodando) return;
  const cfg=gdCfg(); if(!cfg.on&&!op.primeira) return;
  if(!gdTok()){ GD.estado="entrar"; gdPinta(); if(op.gesto) gdEntrar(op.primeira?"conectar":"sync"); return; }
  GD.rodando=true; GD.estado="rodando"; GD.erro=""; gdPinta();

    const {id,pk}=await gdBaixar();
    const R=pk&&Array.isArray(pk.docs)?pk.docs:[], TR=pk&&pk.tomb||{}, L=gdDocsLocais(), TL=gdTombs();
    if(op.primeira&&!op.modo&&R.length&&L.length){ GD.rodando=false; GD.escolha={nR:R.length,nL:L.length,quando:pk.atualizado||""}; GD.estado=""; gdPinta(); return; }

    if(op.modo==="drive") M={docs:R,tomb:TR};
    else if(op.modo==="aparelho") M={docs:L,tomb:{...TR,...TL}};
    else M=gdJuntar(L,TL,R,TR,"local");

    const lm=new Map(L.map(d=>[d.id,d])), mm=new Map(M.docs.map(d=>[d.id,d]));
    const put=M.docs.filter(d=>{ const a=lm.get(d.id); return !a||JSON.stringify(a)!==JSON.stringify(d); });
    const del=L.filter(d=>!mm.has(d.id)).map(d=>d.id);
    if(del.length) await GD.raw.delMany(del);
    if(put.length) await GD.raw.putMany(put);

    const novo={app:"diario-da-carteira",versao:1,atualizado:new Date().toISOString(),docs:M.docs,tomb:M.tomb};
    const mudouDrive=!pk||JSON.stringify(pk.docs)!==JSON.stringify(M.docs)||JSON.stringify(TR)!==JSON.stringify(M.tomb);
    if(mudouDrive) await gdSubir(id,novo);

    if(op.primeira) toast("Pronto: este aparelho está sincronizado com o seu Drive.");
    else if(put.length+del.length) toast(`Sincronizado: ${put.length+del.length} alteração(ões) vieram do Drive.`);

}
function gdMudou(){ if(!gdDisponivel()||!gdCfg().on) return; clearTimeout(GD.timer); GD.estado=gdTok()?"pendente":"entrar"; gdPinta(); if(gdTok()) GD.timer=setTimeout(()=>gdSync(),3000); }
function gdEnvolver(){ // marca data de alteração e guarda o que foi apagado

  store.putMany=async(docs,prog)=>{ const t=Date.now(); await _pm(docs.map(d=>({...d,_u:t})),prog); gdMudou(); };

}
function gdQuando(ms){ if(!ms) return "nunca"; const m=Math.floor((Date.now()-ms)/6e4); return m<1?"agora":m<60?`há ${m} min`:m<1440?`há ${Math.floor(m/60)} h`:`há ${Math.floor(m/1440)} dia(s)`; }
function gdPinta(){ // indicador do topo
  const el=document.getElementById("sync"); if(!el||store.mode!=="local") return;
  const cfg=gdCfg(); if(!gdDisponivel()||!cfg.on){ setSync("local"); el.classList.remove("gd"); el.removeAttribute("role"); return; }
  el.classList.add("gd"); el.setAttribute("role","button"); el.tabIndex=0;

  el.querySelector("span").textContent=st==="rodando"?"Sincronizando…":st==="pendente"?"Salvando no Drive…":st==="entrar"?"Toque para sincronizar":st==="erro"?"Drive: sem conexão":`Drive · ${gdQuando(cfg.last)}`;
  el.title="Sincronização com o Google Drive";
  try{ const ov=document.getElementById("gd-ov"); if(ov&&!ov.hidden) gdRender(); }catch{}
}
function gdAbrir(){
  let ov=document.getElementById("gd-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="gd-ov"; ov.className="gn-ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","Sincronizar com o Google Drive"); document.body.appendChild(ov);
    ov.addEventListener("click",async e=>{ if(e.target===ov){ gdFechar(); return; } const b=e.target.closest("[data-gd]"); if(!b) return; const a=b.dataset.gd;

      else if(a==="conectar"){ gdGravar(GD_K.cfg,{...gdCfg(),on:false}); await gdSync({primeira:true,gesto:true}); }
      else if(a==="agora") await gdSync({gesto:true});

async function boot(){
  let db=null, user=null;
  try{
    if(window.claude && window.claude.use){
      [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    }
  }catch{ db=null; }
  const id = user ? await user.id().catch(()=>null) : null;
  if(!db || !id){ useLocal(); return; }
  const col = db.collection("data/users/"+id);
  store.mode="cloud"; setSync("cloud");
  store.put = async d => { await col.doc(d.id).set(d); };
  store.del = async id2 => { await col.doc(id2).delete(); };
  store.putMany = async (docs,prog) => { let n=0; for(let i=0;i<docs.length;i+=25){ await Promise.all(docs.slice(i,i+25).map(d=>col.doc(d.id).set(d))); n+=Math.min(25,docs.length-i); if(prog) prog(n); } };
  store.delMany = async (ids) => { for(let i=0;i<ids.length;i+=25) await Promise.all(ids.slice(i,i+25).map(x=>col.doc(x).delete())); };
  col.onSnapshot(snap => ingest(snap.docs.map(s => ({...s.data(), id:s.id}))),
    () => { toast("Não foi possível acessar sua conta. Usando o armazenamento do navegador."); useLocal(); });
}




/* ================= CARTÕES DE CRÉDITO ================= */
const CC={sel:null,fat:null,form:null,edit:null,del:null,imp:null,pagar:false,editCard:false};
const CC_CORES=["#820ad1","#ff7a00","#1d1d1f","#0f5c55","#c8102e","#2f6fde","#b8860b","#e8467c"];
const CC_BANCOS={nubank:"Nubank",inter:"Inter",outro:"Outro banco"};
const MESC=ym=>`${MES_ABR[+ym.slice(5)-1]}/${ym.slice(2,4)}`;
/* de onde veio um gasto: cartão, conta do extrato ou lançado à mão */
function origemDe(x){ if(x.cartao) return "cc:"+x.cartao; if(x.conta) return "ct:"+x.conta; if(x.ext&&!String(x.ext).startsWith("proprias|")){ const cs=[...S.contas.values()].filter(c=>c.origem==="extrato"); return cs.length===1?"ct:"+cs[0].id:"ct:?"; } return "manual"; }
function origemNome(o){ if(o==="manual") return "Lançados à mão"; if(o==="ct:?") return "Extrato (conta não identificada)"; const t=o.slice(0,2), id=o.slice(3);
  if(t==="cc"){ const c=S.cartoes.get(id); return c?"Cartão "+c.nome:"Cartão"; }
  const c=S.contas.get(id); if(c) return c.nome; const g=[...S.gastos.values()].find(x=>x.conta===id&&x.orig); return g?g.orig:"Conta"; }
function ccLista(){ return [...S.cartoes.values()].sort((a,b)=>(a.criado||0)-(b.criado||0)); }
function ccDias(c,ym){ const fy=c.fecha<c.vence?ym:ymAdd(ym,-1); return {fech:ymd(fy,Math.min(c.fecha,daysIn(fy))),venc:ymd(ym,Math.min(c.vence,daysIn(ym)))}; }
/* fatura (mês do vencimento) em que cai uma compra feita na data d; no dia do fechamento já vai para a próxima */
function ccFatDe(c,d){ const b=d.slice(0,7); for(let k=-1;k<=3;k++){ const ym=ymAdd(b,k); if(d<ccDias(c,ym).fech) return ym; } return ymAdd(b,1); }
/* fatura que um pagamento quita: a de vencimento mais próximo */
function ccFatPag(c,d){ const b=d.slice(0,7); let best=null,bd=1e9; for(let k=-2;k<=2;k++){ const ym=ymAdd(b,k), v=ccDias(c,ym).venc, dd=diasEntre(d,v)-1; if(dd>=-25&&Math.abs(dd)<bd){ bd=Math.abs(dd); best=ym; } } return best||ccFatDe(c,d); }
function ccGastos(id){ return [...S.gastos.values()].filter(g=>g.cartao===id); }
function ccBase(desc){ return String(desc||"").replace(/\s*[-–·]?\s*\(?\s*parcela\s*\d{1,2}\s*(\/|de)\s*\d{1,2}\s*\)?\s*$/i,"").replace(/\s*\(?\d{1,2}\/\d{1,2}\)?\s*$/,"").trim(); }
function ccParcDe(txt){ const m=String(txt).match(/parcela\s*(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})/i)||String(txt).match(/(?:^|\s)(\d{1,2})\/(\d{1,2})\s*$/); if(!m) return null; const i=+m[1], n=+m[2]; return n>1&&i>=1&&i<=n&&n<=48?{i,n}:null; }
function ccChaveGrupo(g){ return g.parc&&g.parc.g?g.parc.g:ccBase(g.desc).toLowerCase()+"|"+(g.parc?g.parc.n:1)+"|"+g.valor.toFixed(2); }
/* parcelas futuras que ainda não estão lançadas (aparecem como previstas) */
function ccProj(id){
  const grp={}; ccGastos(id).filter(g=>g.parc&&g.parc.n>1&&g.fat).forEach(g=>{ (grp[ccChaveGrupo(g)] ||= []).push(g); });
  const out=[];
  Object.values(grp).forEach(L=>{ const top=L.reduce((a,b)=>b.parc.i>a.parc.i?b:a), tem=new Set(L.map(g=>g.parc.i));
    for(let i=top.parc.i+1;i<=top.parc.n;i++){ if(tem.has(i)) continue; out.push({prev:true,id:"pv_"+top.id+"_"+i,desc:ccBase(top.desc),valor:top.valor,cat:top.cat,fat:ymAdd(top.fat,i-top.parc.i),parc:{i,n:top.parc.n},cartao:id}); } });
  return out;
}
function ccFatura(c,ym,proj){
  const itens=ccGastos(c.id).filter(g=>g.fat===ym).concat((proj||ccProj(c.id)).filter(p=>p.fat===ym));
  const total=Math.round(itens.reduce((t,g)=>t+g.valor,0)*100)/100;
  const pagos=[...S.cpags.values()].filter(p=>p.cartao===c.id&&p.fat===ym), pago=pagos.reduce((t,p)=>t+p.valor,0);
  const {fech,venc}=ccDias(c,ym), hoje=todayISO();
  const fechAnt=ccDias(c,ymAdd(ym,-1)).fech;
  const st=hoje<fechAnt?"futura":hoje<fech?"aberta":(total<=0.009||pago>=total-0.009)?"paga":hoje>venc?"vencida":"fechada";
  return {ym,itens,total,pago,pagos,fech,venc,st,falta:Math.max(0,Math.round((total-pago)*100)/100),prevista:itens.length>0&&itens.every(i=>i.prev)};
}
function ccResumo(c){
  const proj=ccProj(c.id), atual=ccFatDe(c,todayISO());
  const yms=[...new Set([atual,...ccGastos(c.id).map(g=>g.fat),...proj.map(p=>p.fat)].filter(Boolean))].sort();
  const fats=yms.map(ym=>ccFatura(c,ym,proj));
  const usado=fats.filter(f=>f.st!=="paga").reduce((t,f)=>t+f.falta,0);
  return {atual,fats,proj,usado,disp:c.limite?c.limite-usado:null};
}

/* quanto já está comprometido nos próximos meses, somando todos os cartões */
function vCcFuturo(){

/* ---- importar fatura em OFX (Nubank e outros) ---- */
async function ccArquivo(file){
  const c=S.cartoes.get(CC.sel); if(!file||!c) return;
  let txt; try{ const buf=await file.arrayBuffer(); try{ txt=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch{ txt=new TextDecoder("windows-1252").decode(buf); } }catch{ toast("Não foi possível ler o arquivo."); return; }
  if(!/<OFX>/i.test(txt)||!/<STMTTRN>/i.test(txt)){ toast("Esse arquivo não parece ser uma fatura em OFX."); return; }
  const o=parseOFX(txt); if(!o.tx.length){ toast("A fatura não tem lançamentos."); return; }
  const ehPag=t=>/PAGAMENTO|PAGTO|PAG\.? RECEBIDO/.test(ofxNorm(t.memo+" "+t.nome));
  const pags=o.tx.filter(ehPag); let inv;
  if(pags.length) inv=pags.filter(t=>t.valor<0).length>pags.length/2;
  else inv=o.tx.filter(t=>t.valor>0).length>o.tx.length/2;
  const sinal=t=>inv?-t.valor:t.valor; // compra = negativo
  const compras=o.tx.filter(t=>!ehPag(t));
  const bn=ofxNorm(o.banco||"")+" "+(o.bancoId||""), banco=/NU PAG|NUBANK|\b260\b/.test(bn)?"nubank":/INTER|INTERMEDIUM|\b077\b/.test(bn)?"inter":null;
  let alvo=c; if(banco&&c.banco!==banco){ const m=ccLista().find(x=>x.banco===banco); if(m) alvo=m; }
  CC.imp={o,inv,nome:file.name,banco,cartao:alvo.id,fat:ccFatArq(alvo,o)}; CC.sel=alvo.id; CC.form=null; render();
  if(alvo.id!==c.id) toast(`Fatura do ${CC_BANCOS[banco]}: vai para o cartão ${alvo.nome}`);
  const el=document.getElementById("cc-imp"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}
/* fatura do arquivo: a mais comum entre as compras sem parcela, ou pelo fim do período */
function ccFatArq(c,o){ const ehPag=t=>/PAGAMENTO|PAGTO|PAG\.? RECEBIDO/.test(ofxNorm(t.memo+" "+t.nome)); const conta={};
  o.tx.filter(t=>!ehPag(t)).filter(t=>!ccParcDe(t.memo||t.nome)||ccParcDe(t.memo||t.nome).i===1).forEach(t=>{ const f=ccFatDe(c,t.data); conta[f]=(conta[f]||0)+1; });
  return Object.entries(conta).sort((a,b)=>b[1]-a[1])[0]?.[0]||ccFatDe(c,o.fim?addDays(o.fim,-1):o.tx[o.tx.length-1].data); }
function ccPlanoImp(c){
  const I=CC.imp, o=I.o, ehPag=t=>/PAGAMENTO|PAGTO|PAG\.? RECEBIDO/.test(ofxNorm(t.memo+" "+t.nome));
  const ext=new Set(ccGastos(c.id).filter(g=>g.ext).map(g=>g.ext)), extP=new Set([...S.cpags.values()].filter(p=>p.ext).map(p=>p.ext));
  const manuais=ccGastos(c.id).filter(g=>!g.ext);
  const {fech}=ccDias(c,I.fat), ini=ccDias(c,ymAdd(I.fat,-1)).fech;
  const novos=[], ligar=[], pagos=[]; let ja=0; const impId="ccimp_"+c.id+"_"+I.fat;
  const chaves=ofxChavesUnicas(o.tx);
  o.tx.forEach((t,i)=>{
    const v=I.inv?-t.valor:t.valor, key="cc|"+c.id+"|"+(t.fitid||chaves[i]);
    if(ehPag(t)){ if(v>0){ if(extP.has(key)||[...S.cpags.values()].some(p=>p.cartao===c.id&&Math.abs(p.valor-v)<0.01&&Math.abs(diasEntre(p.data,t.data))<=6)){ ja++; return; } pagos.push({kind:"cpag",id:"cp_"+uid()+i,cartao:c.id,fat:ymAdd(I.fat,-1),valor:Math.round(v*100)/100,data:t.data,ext:key,imp:impId,criado:Date.now()+i}); } return; }
    if(ext.has(key)){ ja++; return; }
    const txt=t.memo||t.nome, parc=ccParcDe(txt), valor=Math.round(-v*100)/100; // compra positiva; estorno negativo
    const nomeT=ofxTitle(ccBase(ofxLimpaNome({nome:t.nome,memo:t.memo})||txt))||"Compra";
    const m=manuais.findIndex(g=>g.fat===I.fat&&Math.abs(g.valor-valor)<0.02&&(!g.parc||!parc||g.parc.i===parc.i));
    if(m>=0){ ligar.push({...manuais[m],ext:key,imp:impId,lig:true}); manuais.splice(m,1); return; }
    const k=ofxChave({nome:t.nome,memo:t.memo}); const rg=regraDe(k); const cl=ofxClassifica({...t,valor:-1},{});
    let cat=rg?rg.cat:(cl.cat||"outros"); if(cat==="cartao"||cat==="ignorar") cat="outros";
    let data=t.data; if(data<ini) data=ini; if(data>=fech) data=addDays(fech,-1);
    if(valor<0) cat=cat||"outros";
    novos.push({kind:"gasto",id:"g_"+uid()+i,desc:(valor<0?"Estorno · ":"")+nomeT+(parc?` (${parc.i}/${parc.n})`:""),valor,data,cat,pag:"Crédito",fixo:false,criado:Date.now()+i,cartao:c.id,fat:I.fat,ext:key,imp:impId,...(parc?{parc}:{})});
  });
  return {novos,ligar,pagos,ja};
}

/* pagamento de fatura que aparece no extrato do banco */
function ccPagExtrato(t){
  if(!S.cartoes||!S.cartoes.size||t.valor>=0) return null;
  const txt=ofxNorm((t.memo||"")+" "+(t.nome||"")), cs=ccLista(); let c=null;
  if(/NU PAGAMENTOS|NUBANK/.test(txt)) c=cs.find(x=>x.banco==="nubank");
  else if(/FATURA/.test(txt)) c=cs.find(x=>x.banco==="inter")||(cs.length===1?cs[0]:null);
  if(!c||t.data<(c.desde||"")) return null;
  return {c,fat:ccFatPag(c,t.data)};
}

const BK_KEY="diario-carteira-ultimo-backup";
function bkDocs(){ return [...S.assets.values(),...S.entries.values(),...S.gastos.values(),...S.orc.values(),...S.regras.values(),...S.entradas.values(),...S.contas.values(),...S.pagar.values(),...S.pagtos.values(),...S.rendas.values(),...S.emps.values(),...S.recebs.values(),...S.cartoes.values(),...S.cpags.values(),{kind:"pref",id:"pref_tema",tema:temaAtual}]; }
function bkUltimo(){ try{ return localStorage.getItem(BK_KEY)||""; }catch{ return ""; } }
async function bkExportar(){
  const docs=bkDocs(); const agora=new Date(); const d=todayISO();
  const pacote={app:"diario-da-carteira",versao:1,exportado:agora.toISOString(),total:docs.length,docs};
  const ok=await salvarArquivo(`backup-carteira-${d}.json`,new Blob([JSON.stringify(pacote)],{type:"application/json"}));
  if(ok){ try{ localStorage.setItem(BK_KEY,d); }catch{} toast(`Backup salvo com ${docs.length} registros.`); render(); }
}
const BK={pacote:null,etapa:"",prog:0};
function bkEscolher(){ let i=document.getElementById("bk-file"); if(!i){ i=document.createElement("input"); i.type="file"; i.id="bk-file"; i.accept=".json,application/json"; i.hidden=true; document.body.appendChild(i);
    i.addEventListener("change",async()=>{ const f=i.files&&i.files[0]; i.value=""; if(!f) return; try{ const p=JSON.parse(await f.text()); if(!p||p.app!=="diario-da-carteira"||!Array.isArray(p.docs)) throw 0; BK.pacote=p; BK.etapa="escolher"; bkModal(); }catch{ toast("Esse arquivo não é um backup do Diário da Carteira."); } }); }
  i.click(); }
function bkFechar(){ const ov=document.getElementById("bk-ov"); if(!ov) return; if(BK.etapa==="gravando") return; ov.classList.remove("show"); document.body.classList.remove("gn-on"); setTimeout(()=>{ ov.hidden=true; },220); BK.pacote=null; }
function bkModal(){
  let ov=document.getElementById("bk-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="bk-ov"; ov.className="gn-ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","Importar backup"); document.body.appendChild(ov);
    ov.addEventListener("click",e=>{ if(e.target===ov){ bkFechar(); return; } const b=e.target.closest("[data-bk]"); if(!b) return; const k=b.dataset.bk; if(k==="fechar") bkFechar(); else bkAplicar(k); }); }
  const p=BK.pacote; const cont={}; p.docs.forEach(d=>cont[d.kind]=(cont[d.kind]||0)+1);
  const atuais=bkDocs().length-1, novos=p.docs.filter(d=>d.id&&!bucketTem(d)).length;
  const itens=[["lanc","lançamentos de investimentos"],["ativo","ativos"],["gasto","gastos"],["entrada","entradas"],["conta","contas"],["pagar","contas a pagar"],["emprestimo","empréstimos"],["cartao","cartões"]].filter(([k])=>cont[k]).map(([k,n])=>`<li><b>${cont[k]}</b> ${n}</li>`).join("");
  const quando=p.exportado?new Date(p.exportado):null;
  ov.innerHTML=`<div class="gn-sheet bk-sheet" tabindex="-1"><span class="gn-grab" aria-hidden="true"></span>
    <div class="gn-h"><div><b>Importar backup</b><small>${quando?`Arquivo de ${quando.toLocaleDateString("pt-BR")} às ${quando.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`:"Arquivo de backup"} · ${p.docs.length} registros</small></div>${BK.etapa==="gravando"?"":`<button class="icon-btn gn-x" data-bk="fechar" aria-label="Fechar">${svgI('<path d="M6 6l12 12M18 6L6 18"/>',18)}</button>`}</div>
    ${BK.etapa==="gravando"?`<div class="bk-prog"><b>Gravando os dados… ${BK.prog}%</b><span class="gbar"><b style="width:${BK.prog}%"></b></span><small>Não feche esta tela.</small></div>`:`
    <ul class="bk-lista">${itens}</ul>
    <p class="hint">Neste aparelho hoje: <b>${atuais}</b> registros. ${novos?`O backup tem <b>${novos}</b> que não existem aqui.`:"Tudo o que está no backup já existe aqui."}</p>
    <div class="bk-op">
      <button class="bk-b" data-bk="substituir"><b>Substituir tudo</b><small>Os dados deste aparelho ficam iguais aos do arquivo. O que existe aqui e não está no backup é apagado.</small></button>
      <button class="bk-b" data-bk="juntar"><b>Juntar</b><small>Mantém o que já existe aqui e acrescenta só o que falta. Nada é apagado.</small></button>
    </div>`}</div>`;
  ov.hidden=false; document.body.classList.add("gn-on"); requestAnimationFrame(()=>ov.classList.add("show"));
}
function bucketTem(d){ const b=bucket(d.kind); return b?b.has(d.id):d.kind==="pref"; }
async function bkAplicar(modo){
  const p=BK.pacote; if(!p) return;
  let docs=p.docs.filter(d=>d&&d.id&&d.kind&&(bucket(d.kind)||d.kind==="pref"));
  const tema=docs.find(d=>d.kind==="pref"&&d.tema);
  docs=docs.filter(d=>d.kind!=="pref");
  BK.etapa="gravando"; BK.prog=0; bkModal();
  const prog=n=>{ BK.prog=Math.round(n/Math.max(1,docs.length)*100); const el=document.querySelector("#bk-ov .bk-prog b"); if(el) el.textContent=`Gravando os dados… ${BK.prog}%`; const br=document.querySelector("#bk-ov .gbar b"); if(br) br.style.width=BK.prog+"%"; };
  try{
    if(modo==="substituir"){ const manter=new Set(docs.map(d=>d.id)); const apagar=bkDocs().filter(d=>d.kind!=="pref"&&!manter.has(d.id)).map(d=>d.id); if(apagar.length) await store.delMany(apagar); }
    else docs=docs.filter(d=>!bucketTem(d));
    if(docs.length) await store.putMany(docs,prog);
    if(tema&&T[tema.tema]) applyTheme(tema.tema);
    BK.etapa=""; bkFechar(); toast(modo==="substituir"?"Backup restaurado.":`${docs.length} registros acrescentados.`); render();
  }catch{ BK.etapa=""; bkFechar(); toast("A importação parou no meio. Tente de novo com o mesmo arquivo."); }
}

/* ---------- Caixinha de arquivos: passar arquivos entre aparelhos (pelo Claude) ---------- */
const CX={assets:undefined,env:false,erro:"",del:null,ver:null};
const CX_TIPOS={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif",heic:null,pdf:"application/pdf",json:"application/json",csv:"text/csv",txt:"text/plain",ofx:"text/plain",qfx:"text/plain",md:"text/markdown",mp4:"video/mp4",webm:"video/webm"};
async function cxAssets(){ if(CX.assets!==undefined) return CX.assets; try{ CX.assets=window.claude&&window.claude.use&&store.mode==="cloud"?await window.claude.use("assets"):null; }catch{ CX.assets=null; } return CX.assets; }
const cxExt=n=>(String(n).split(".").pop()||"").toLowerCase();

function cxQuando(ms){ const d=Math.floor((Date.now()-ms)/864e5), h=Math.floor((Date.now()-ms)/36e5), m=Math.floor((Date.now()-ms)/6e4); return m<1?"agora":m<60?`há ${m} min`:h<24?`há ${h} h`:d===1?"ontem":`há ${d} dias`; }
async function cxAbrir(){
  let ov=document.getElementById("cx-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="cx-ov"; ov.className="gn-ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label","Caixinha de arquivos"); document.body.appendChild(ov);
    ov.addEventListener("click",async e=>{ if(e.target===ov){ cxFechar(); return; } const b=e.target.closest("[data-cx]"); if(!b) return; const a=b.dataset.cx, id=b.dataset.id, f=id?S.arqs.get(id):null;
      if(a==="x") cxFechar();
      else if(a==="add"){ const i=document.getElementById("cx-file"); if(i) i.click(); }
      else if(a==="ver"){ CX.ver=CX.ver===id?null:id; cxRender(); }
      else if(a==="baixar"&&f){ try{ const r=await fetch("/_blob/"+f.asset); if(!r.ok) throw 0; await salvarArquivo(f.nome,await r.blob()); }catch{ toast("Não foi possível baixar. Tente de novo."); } }
      else if(a==="usar"&&f){ try{ const r=await fetch("/_blob/"+f.asset); if(!r.ok) throw 0; const bl=await r.blob(); const e2=cxExt(f.nome); cxFechar();
          if(e2==="ofx"||e2==="qfx"){ S.tab="gastos"; GI.open=true; render(); await giArquivo(new File([bl],f.nome,{type:"text/plain"})); setTimeout(()=>{ const c=document.getElementById("gi"); if(c) c.scrollIntoView({behavior:"smooth",block:"start"}); },60); }
          else if(e2==="json"){ const pk=JSON.parse(await bl.text()); if(!pk||pk.app!=="diario-da-carteira"||!Array.isArray(pk.docs)) throw 1; BK.pacote=pk; BK.etapa="escolher"; bkModal(); } }
        catch(er){ toast(er===1?"Esse arquivo não é um backup do Diário da Carteira.":"Não foi possível abrir o arquivo."); } }
      else if(a==="del"){ CX.del=id; cxRender(); }
      else if(a==="del-no"){ CX.del=null; cxRender(); }
      else if(a==="del-ok"&&f){ CX.del=null; await cxApagar([f]); }
      else if(a==="limpar"){ const velhos=[...S.arqs.values()].filter(x=>Date.now()-(x.criado||0)>7*864e5); if(velhos.length) await cxApagar(velhos); }
      else if(a==="share"){ const i=document.getElementById("cx-share"); if(i) i.click(); } });
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!ov.hidden&&ov.classList.contains("show")) cxFechar(); }); }
  if(!document.getElementById("cx-file")){ const i=document.createElement("input"); i.type="file"; i.id="cx-file"; i.multiple=true; i.hidden=true; document.body.appendChild(i); i.addEventListener("change",async()=>{ const fs=[...(i.files||[])]; i.value=""; if(fs.length) await cxEnviar(fs); }); }
  if(!document.getElementById("cx-share")){ const i=document.createElement("input"); i.type="file"; i.id="cx-share"; i.hidden=true; document.body.appendChild(i); i.addEventListener("change",async()=>{ const f=i.files&&i.files[0]; i.value=""; if(!f) return; try{ if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:f.name}); else toast("Este aparelho não permite compartilhar arquivos daqui."); }catch(e){ if(e&&e.name!=="AbortError") toast("Não foi possível compartilhar."); } }); }
  CX.del=null; cxRender(); ov.hidden=false; document.body.classList.add("gn-on"); requestAnimationFrame(()=>ov.classList.add("show"));
  await cxAssets(); cxRender();
}
function cxFechar(){ const ov=document.getElementById("cx-ov"); if(!ov||ov.hidden) return; ov.classList.remove("show"); document.body.classList.remove("gn-on"); setTimeout(()=>{ if(!ov.classList.contains("show")) ov.hidden=true; },220); }
async function cxEnviar(fs){
  const A=await cxAssets(); if(!A){ toast("A caixinha só funciona pelo Claude."); return; }
  CX.env=true; CX.erro=""; cxRender(); let ok=0;
  for(const f of fs){
    const e=cxExt(f.name); let tipo=CX_TIPOS[e]; if(tipo===undefined&&/^(image|video)\//.test(f.type)) tipo=f.type;
    if(!tipo){ CX.erro=`"${f.name}" não pode ir para a caixinha. Aceita fotos, PDF, extrato OFX, backup JSON, CSV e TXT.`; continue; }
    if(f.size>20*1048576){ CX.erro=`"${f.name}" passa de 20 MB.`; continue; }
    try{
      let blob=f;
      if(tipo.startsWith("text/")||tipo==="application/json"){ const buf=await f.arrayBuffer(); let txt; try{ txt=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch{ txt=new TextDecoder("windows-1252").decode(buf); } blob=new Blob([txt],{type:tipo}); }
      const r=await A.upload(blob,{type:tipo});
      await store.put({kind:"arq",id:"arq_"+uid(),nome:f.name,tipo:r.contentType||tipo,tam:r.sizeBytes||f.size,asset:r.id,criado:Date.now()}); ok++;
    }catch(er){ CX.erro=er&&er.code==="quota_exceeded"?"A caixinha está cheia. Apague alguns arquivos.":er&&er.code==="unsupported_type"?`"${f.name}": tipo de arquivo não aceito.`:`Não foi possível enviar "${f.name}".`; }
  }
  CX.env=false; cxRender(); if(ok) toast(ok>1?`${ok} arquivos na caixinha`:"Arquivo na caixinha. Abra no outro aparelho.");
}
async function cxApagar(lista){
  const A=await cxAssets(); let n=0;
  for(const f of lista){ try{ if(A&&f.asset) await A.delete(f.asset).catch(er=>{ if(!er||er.code!=="not_found") throw er; }); await store.del(f.id); n++; }catch{} }
  cxRender(); toast(n?(n>1?`${n} arquivos apagados`:"Arquivo apagado"):"Não foi possível apagar.");
}
function cxRender(){
  const ov=document.getElementById("cx-ov"); if(!ov) return;
  const A=CX.assets, fs=[...S.arqs.values()].sort((a,b)=>(b.criado||0)-(a.criado||0)), velhos=fs.filter(x=>Date.now()-(x.criado||0)>7*864e5).length;

  else corpo=`<button class="cx-drop" data-cx="add" ${CX.env?"disabled":""}>${svgI('<path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',22)}<b>${CX.env?"Enviando…":"Colocar arquivo na caixinha"}</b><small>Fotos, PDF, extrato OFX, backup JSON, CSV ou TXT · até 20 MB</small></button>
    ${CX.erro?`<p class="cx-err" role="alert">${esc(CX.erro)}</p>`:""}
    ${fs.length?`<div class="cx-l">${fs.map(f=>{ const e=cxExt(f.nome), img=/^image\//.test(f.tipo), usar=e==="ofx"||e==="qfx"?"Importar extrato":e==="json"?"Importar backup":"", velho=Date.now()-(f.criado||0)>7*864e5;
        return `<div class="cx-it"><div class="cx-row">${img?`<img class="cx-th" src="/_blob/${esc(f.asset)}" alt="" loading="lazy">`:`<span class="cx-ic">${svgI(cxIco(f),18)}</span>`}
          <span class="cx-m"><b>${esc(f.nome)}</b><small class="${velho?"velho":""}">${cxTam(f.tam||0)} · ${cxQuando(f.criado||0)}${velho?" · temporário antigo":""}</small></span></div>
          ${CX.del===f.id?`<div class="cx-a"><span>Apagar de vez?</span><button class="btn sm danger" data-cx="del-ok" data-id="${f.id}">Apagar</button><button class="btn sm" data-cx="del-no">Cancelar</button></div>`
          :`<div class="cx-a">${usar?`<button class="btn sm primary" data-cx="usar" data-id="${f.id}">${usar}</button>`:""}${img||f.tipo==="application/pdf"?`<button class="btn sm" data-cx="ver" data-id="${f.id}">${CX.ver===f.id?"Fechar":"Ver"}</button>`:""}<button class="btn sm" data-cx="baixar" data-id="${f.id}">Baixar</button><button class="btn sm ghost danger" data-cx="del" data-id="${f.id}" aria-label="Apagar ${esc(f.nome)}">Apagar</button></div>`}
          ${CX.ver===f.id?(img?`<img class="cx-pv" src="/_blob/${esc(f.asset)}" alt="${esc(f.nome)}">`:`<iframe class="cx-pv" src="/_blob/${esc(f.asset)}" title="${esc(f.nome)}"></iframe>`):""}</div>`; }).join("")}</div>

  ov.innerHTML=`<div class="gn-sheet cx-sheet" tabindex="-1"><span class="gn-grab" aria-hidden="true"></span>

/* ---------- Histórico de um ativo (painel sobreposto) ---------- */
const AH={id:null,per:"tudo",del:null}; let ahChart=null;
function ahSerie(id){
  const filhos=[...S.assets.values()].filter(a=>a.pai===id&&!a.oculto);
  const ids=filhos.length?filhos.map(a=>a.id):[id];
  const es=[...S.entries.values()].filter(e=>ids.includes(e.ativo)).sort((a,b)=>a.data.localeCompare(b.data));
  const datas=[...new Set(es.map(e=>e.data))];
  const ult={}; let ant=null, apl=0; const rows=[];
  datas.forEach(d=>{ const doDia=es.filter(e=>e.data===d); let ap=0; doDia.forEach(e=>{ ult[e.ativo]=e.saldo; ap+=e.aporte||0; });
    const saldo=Object.values(ult).reduce((t,v)=>t+v,0);
    let ganho=null, pc=null, dias=null;
    if(ant==null){ apl=saldo; } else { apl+=ap; ganho=saldo-ant.saldo-ap; pc=ant.saldo>0?ganho/ant.saldo:null; dias=diasEntre(ant.data,d)-1; }
    const r={data:d,saldo,ap:ant==null?0:ap,ganho,pc,dias,apl,ids:doDia.map(e=>e.id),primeiro:ant==null}; rows.push(r); ant=r; });
  return {rows,filhos,soma:filhos.length>0};
}
function ahAbrir(id){ AH.id=id; AH.per="tudo"; AH.del=null; ahRender(true); }
function ahFechar(){ const ov=document.getElementById("ah-ov"); if(!ov||ov.hidden) return; ov.classList.remove("show"); document.body.classList.remove("gn-on"); if(ahChart){ ahChart.destroy(); ahChart=null; } setTimeout(()=>{ if(!ov.classList.contains("show")) ov.hidden=true; },220); }
function ahRender(abrir){
  const a=S.assets.get(AH.id); if(!a) return;
  let ov=document.getElementById("ah-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="ah-ov"; ov.className="gn-ov ah-ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); document.body.appendChild(ov);
    ov.addEventListener("click",async e=>{ if(e.target===ov){ ahFechar(); return; } const b=e.target.closest("[data-ah]"); if(!b) return; const k=b.dataset.ah;
      if(k==="fechar") ahFechar();
      else if(k==="per"){ AH.per=b.dataset.v; AH.del=null; ahRender(); }
      else if(k==="editar"){ ahFechar(); S.entryDate=b.dataset.d; S.drafts={}; S.tab="lancar"; render(); window.scrollTo({top:0}); }
      else if(k==="del"){ AH.del=b.dataset.d; ahRender(); }
      else if(k==="del-no"){ AH.del=null; ahRender(); }
      else if(k==="del-ok"){ const ids=b.dataset.ids.split(","); AH.del=null; await safe(store.delMany?store.delMany(ids):Promise.all(ids.map(x=>store.del(x))),"Lançamento excluído"); ahRender(); }
      else if(k==="lancar"){ ahFechar(); S.tab="lancar"; render(); window.scrollTo({top:0}); } });
    document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!ov.hidden&&ov.classList.contains("show")){ e.preventDefault(); ahFechar(); } });
  }
  ov.setAttribute("aria-label","Histórico de "+a.nome);
  const {rows,filhos,soma}=ahSerie(AH.id);
  const fim=rows[rows.length-1];
  const cortes={"3m":3,"6m":6,"12m":12}; const hoje=todayISO();
  const desde=cortes[AH.per]?ymAdd(hoje.slice(0,7),-(cortes[AH.per]-1))+"-01":"";
  const lista=rows.filter(r=>r.data>=desde).slice().reverse();
  const meses={}; lista.forEach(r=>{ const m=r.data.slice(0,7); (meses[m] ||= []).push(r); });
  const DS=["dom","seg","ter","qua","qui","sex","sáb"];

/* ---------- Cálculos ---------- */
function compute(){
  const vis=[...S.assets.values()].filter(a=>!a.oculto);
  const visIds=new Set(vis.map(a=>a.id));
  const ord=(a,b)=>(a.ordem??0)-(b.ordem??0)||a.nome.localeCompare(b.nome);
  const isTop=a=>!a.pai||!visIds.has(a.pai);
  const tops=vis.filter(isTop).sort(ord);
  const pais=new Set(vis.filter(a=>!isTop(a)).map(a=>a.pai));
  const assets=[]; // ativos que recebem lançamentos (subcategorias ficam junto do ativo principal)
  tops.forEach(t=>{ if(pais.has(t.id)) vis.filter(a=>a.pai===t.id).sort(ord).forEach(f=>assets.push(f)); else assets.push(t); });
  const ids=new Set(assets.map(a=>a.id));
  const by={}; const dset=new Set();
  for(const e of S.entries.values()){ if(!ids.has(e.ativo)) continue; (by[e.ativo] ||= []).push(e); dset.add(e.data); }
  for(const k in by) by[k].sort((a,b)=>a.data.localeCompare(b.data));
  const dates=[...dset].sort();
  const ptr={}, cur={}, inv={}, started={};
  assets.forEach(a=>{ptr[a.id]=0;cur[a.id]=0;inv[a.id]=0;});
  const rows=[]; let prevTotal=0, idx=1, invested=0;
  for(const d of dates){
    let flow=0; const per={};
    for(const a of assets){
      const list=by[a.id]; if(!list){per[a.id]=0;continue;}
      while(ptr[a.id]<list.length && list[ptr[a.id]].data===d){
        const e=list[ptr[a.id]++];
        const f = started[a.id] ? (e.aporte||0) : e.saldo;   // 1º lançamento = valor aplicado inicial
        started[a.id]=true; flow+=f; inv[a.id]+=f; cur[a.id]=e.saldo;
      }
      per[a.id]=cur[a.id];
    }
    const total=assets.reduce((s,a)=>s+per[a.id],0);
    invested+=flow;
    const r = prevTotal>0 ? (total-flow-prevTotal)/prevTotal : 0;
    const ganho = prevTotal>0 ? total-flow-prevTotal : 0;
    idx*=1+r;
    rows.push({data:d,total,flow,invested,r,ganho,idx,per:{...per},invPer:{...inv}});
    prevTotal=total;
  }
  const last=rows[rows.length-1];
  const perAsset=assets.map(a=>{
    const v=last?last.per[a.id]:0, i=last?last.invPer[a.id]:0;
    const list=by[a.id]||[];
    return {a, valor:v, investido:i, lucro:v-i, rent:i>0?(v-i)/i:NaN, ultima:list.length?list[list.length-1]:null, n:list.length};
  });
  const pa=new Map(perAsset.map(p=>[p.a.id,p]));
  const top=tops.map(t=>{
    if(!pais.has(t.id)) return {...pa.get(t.id),filhos:null};
    const fs=perAsset.filter(p=>p.a.pai===t.id);
    const valor=fs.reduce((s,f)=>s+f.valor,0), investido=fs.reduce((s,f)=>s+f.investido,0);
    const ultima=fs.map(f=>f.ultima).filter(Boolean).sort((x,y)=>y.data.localeCompare(x.data))[0]||null;
    return {a:t,valor,investido,lucro:valor-investido,rent:investido>0?(valor-investido)/investido:NaN,ultima,n:fs.reduce((s,f)=>s+f.n,0),filhos:fs};
  });
  // mensal
  const months=[]; let mi=-1;
  rows.forEach((r,i)=>{
    const ym=r.data.slice(0,7);
    if(mi<0||months[mi].ym!==ym){ months.push({ym,ini:i>0?rows[i-1].total:0,aportes:0,ganho:0,f:1,fim:0}); mi++; }
    const m=months[mi]; m.aportes+=r.flow; m.ganho+=r.ganho; m.f*=1+r.r; m.fim=r.total;
  });
  months.forEach(m=>m.rent=m.f-1);
  return {assets,rows,last,perAsset,top,tops,pais,months,by,dates};
}

function applyTheme(id,{save=true}={}){
  const t=T[id]||T.petroleo; temaAtual=T[id]?id:"petroleo";
  const st=document.documentElement.style;
  K.forEach((k,i)=>st.setProperty("--"+k,t.v[i]));
  t.s.forEach((c,i)=>st.setProperty("--s"+(i+1),c));
  st.setProperty("color-scheme",t.scheme);
  document.documentElement.dataset.tema=temaAtual;
  if(t.glass){ document.documentElement.dataset.glass=t.modo; Object.entries(t.glass).forEach(([k,v])=>st.setProperty("--gl-"+k,v)); } else delete document.documentElement.dataset.glass;
  st.setProperty("--hero-bink",/^#f/i.test(t.v[19])?"#1d232b":"#ffffff");

    if(!document.querySelector('meta[name="apple-mobile-web-app-capable"]')){ [["apple-mobile-web-app-capable","yes"],["mobile-web-app-capable","yes"],["apple-mobile-web-app-title","Carteira"],["apple-mobile-web-app-status-bar-style","black-translucent"]].forEach(([n,c])=>{ const x=document.createElement("meta"); x.name=n; x.content=c; document.head.appendChild(x); }); } }catch{}
  document.getElementById("theme-sw").innerHTML=[t.v[21],t.v[7],t.v[26]].map(c=>`<i style="background:${c}"></i>`).join("");
  if(save){ try{localStorage.setItem(TKEY,temaAtual);}catch{} if(store.mode==="cloud") store.put({kind:"pref",id:"pref_tema",tema:temaAtual}).catch(()=>{}); }

/* ---------- Painel: bloco de desempenho ---------- */
function sparkPath(vals,w,h){
  if(vals.length<2) return null;
  const mn=Math.min(...vals), mx=Math.max(...vals), r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w, h-((v-mn)/r)*(h-4)-2]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return {line, area:line+` L${w} ${h} L0 ${h} Z`, last:pts[pts.length-1]};
}
function vDesempenho(C,L,lucro,rentTot,mes,rentAno,ano){
  const aplic=Math.max(0,L.invested), tot=Math.max(L.total,0);
  const base=Math.max(aplic,tot,1);

    const base=m.rent>=0?css("--pos"):css("--neg"); const forte=a>0.45; const txt=!forte?"var(--ink)":(luz(base)>0.5?"#10201c":"#ffffff");

  const up=lucro>=0;
  return `<div class="perf">
    <div class="pf-comp">
      <div class="pf-top"><span class="eyebrow">De onde vem seu patrimônio</span><span class="pf-rt ${rentTot>=0?"pos":"neg"}" title="Rentabilidade acumulada, descontando aportes e resgates">${pct(rentTot)} <small>desde ${dBR(C.rows[0].data)}</small></span></div>

      </div>
      <div class="pf-leg">
        <div><i class="ap"></i><span>Você aplicou</span><b>${fmt(aplic)}</b></div>
        <div class="${up?"":"neg"}"><i class="${up?"rd":"pd"}"></i><span>${up?"O dinheiro rendeu":"Perdeu"}</span><b class="${up?"pos-t":"neg-t"}">${fmtS(lucro)}</b>${isFinite(rendSobreAp)?`<small>${pct(rendSobreAp)} sobre o aplicado</small>`:""}</div>
      </div>
    </div>

      <div class="pf-mes-t"><span class="eyebrow">${mLong(ym)}</span>

function grpEstado(C,pid,d){

  const prevTot=itens.reduce((s,x)=>s+(x.prev?x.prev.saldo:0),0);
  const prevData=itens.map(x=>x.prev&&x.prev.data).filter(Boolean).sort().pop()||null;
  const todosEx=itens.length&&itens.every(x=>x.ex);
  return {fs,itens,prevTot,prevData,exTot:todosEx?itens.reduce((s,x)=>s+x.ex.saldo,0):null,exAp:todosEx?itens.reduce((s,x)=>s+(x.ex.aporte||0),0):null};

function somarSeries(listas){ // listas: [[{data,saldo,aporte}]] -> série única com saldo somado (carregando o último saldo de cada uma)
  const datas=[...new Set(listas.flatMap(l=>l.map(d=>d.data)))].sort();
  const idx=listas.map(()=>0), cur=listas.map(()=>0);
  return datas.map(dt=>{ let ap=0; listas.forEach((l,k)=>{ while(idx[k]<l.length&&l[idx[k]].data===dt){ cur[k]=l[idx[k]].saldo; ap+=l[idx[k]].aporte||0; idx[k]++; } });
    return {data:dt,saldo:Math.round(cur.reduce((a,b)=>a+b,0)*100)/100,aporte:Math.round(ap*100)/100}; });
}
const JKEY=pid=>"diario-junta-"+pid;
function juntaPlanoSalvo(pid){ try{ const s=localStorage.getItem(JKEY(pid)); return s?JSON.parse(s):null; }catch{ return S.juntaPlano&&S.juntaPlano[pid]||null; } }
function juntaGuardar(pid,plano){ S.juntaPlano=S.juntaPlano||{}; S.juntaPlano[pid]=plano; try{ if(plano) localStorage.setItem(JKEY(pid),JSON.stringify(plano)); else localStorage.removeItem(JKEY(pid)); }catch{} }
async function tenta(fn){ let espera=600; for(let i=0;;i++){ try{ return await fn(); }catch(e){ const c=e&&e.code; if(i>=4||!(c==="resource_exhausted"||c==="unavailable"||!c)) throw e; await new Promise(r=>setTimeout(r,espera+Math.random()*400)); espera*=2; } } }
async function juntarSubs(pid){
  const pai=S.assets.get(pid); if(!pai||S.juntando) return;
  // Plano: calculado uma vez (ou retomado de uma tentativa interrompida)
  let plano=juntaPlanoSalvo(pid);
  if(!plano){
    const filhos=[...S.assets.values()].filter(a=>a.pai===pid);
    const listas=filhos.map(f=>[...S.entries.values()].filter(e=>e.ativo===f.id).sort((a,b)=>a.data.localeCompare(b.data)));
    const imps=new Set(listas.flat().map(e=>e.imp).filter(Boolean));
    const serie=somarSeries(listas);
    const porData={}; listas.flat().forEach(e=>{ (porData[e.data]=porData[e.data]||[]).push(e.id); });
    plano={passos:serie.map(d=>({doc:{kind:"lanc",id:`l_${pid}_${d.data}`,ativo:pid,data:d.data,saldo:d.saldo,aporte:d.aporte,...(imps.size===1?{imp:[...imps][0]}:{})},apagar:porData[d.data]||[]})),filhos:filhos.map(f=>f.id),feitos:0};
    juntaGuardar(pid,plano);
  }
  const total=plano.passos.length+1;
  S.juntando={id:pid,feito:plano.feitos,total}; render();
  try{
    // Por data: primeiro apaga os lançamentos das subcategorias daquele dia, depois grava o total.
    // Assim a quantidade de registros na conta nunca aumenta no meio do caminho.
    const LOTE=8;
    for(let i=plano.feitos;i<plano.passos.length;i+=LOTE){
      const lote=plano.passos.slice(i,i+LOTE);
      const ids=lote.flatMap(p=>p.apagar);
      for(let j=0;j<ids.length;j+=8) await Promise.all(ids.slice(j,j+8).map(id=>tenta(()=>store.delMany([id]))));
      await Promise.all(lote.map(p=>tenta(()=>store.putMany([p.doc]))));
      plano.feitos=Math.min(plano.passos.length,i+LOTE); juntaGuardar(pid,plano);
      S.juntando={id:pid,feito:plano.feitos,total}; render();
    }
    for(const id of plano.filhos) await tenta(()=>store.delMany([id]));
  }catch(e){
    S.juntando=null; S.confirmJunta=null; render();
    toast(e&&e.code==="quota_exceeded"?"O espaço da sua conta está cheio. Apague dados antigos e tente de novo.":"A conexão falhou no meio do processo. Toque em “Continuar” para terminar — nada foi perdido.");
    return;
  }
  juntaGuardar(pid,null); S.juntando=null; S.confirmJunta=null; render();
  toast(`${pai.nome} agora é um ativo único, com ${plano.passos.length} lançamento(s) no histórico`);
}

async function logoArquivo(key,f){
  if(!f) return; if(f.type&&!/^image\//.test(f.type)){ toast("Escolha um arquivo de imagem."); return; }
  try{
    const url=URL.createObjectURL(f); const img=new Image();
    await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=url; });
    const N=128, c=document.createElement("canvas"); c.width=N; c.height=N; const g=c.getContext("2d");
    const r=Math.min(N/img.naturalWidth,N/img.naturalHeight), w=img.naturalWidth*r, h=img.naturalHeight*r;
    g.imageSmoothingQuality="high"; g.drawImage(img,(N-w)/2,(N-h)/2,w,h); URL.revokeObjectURL(url);
    let d=c.toDataURL("image/webp",0.9); if(!d.startsWith("data:image/webp")) d=c.toDataURL("image/png");
    if(d.length>120000){ const c2=document.createElement("canvas"); c2.width=N; c2.height=N; const g2=c2.getContext("2d"); g2.fillStyle="#fff"; g2.fillRect(0,0,N,N); g2.drawImage(c,0,0); d=c2.toDataURL("image/jpeg",0.85); }
    LOGO[key]=d; logoPintar(key);
  }catch{ toast("Não consegui abrir essa imagem. Tente outra (PNG ou JPG)."); }
}

/* ==== Leitor do extrato de movimentações do Inter (puro, testável) ==== */
const INTER_MESES={janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function interNum(s){ s=String(s).replace(/[^\d.,]/g,""); if(!s) return NaN; return s.includes(",")?Number(s.replace(/\./g,"").replace(",",".")):Number(s); }
function interLines(items){
  const its=items.filter(i=>i.s && i.s.trim()!=="" ).sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of its){ let L=lines.find(l=>Math.abs(l.y-it.y)<=1.5); if(!L){ L={y:it.y,items:[]}; lines.push(L); } L.items.push(it); }
  lines.forEach(l=>{ l.items.sort((a,b)=>a.x-b.x); l.text=l.items.map(i=>i.s).join(" ").replace(/\u0000/g,"±").replace(/\s+/g," ").trim(); });
  return lines.sort((a,b)=>b.y-a.y);
}
function interTipo(produto,ativo){
  const p=produto.toUpperCase(), a=ativo.toUpperCase();
  if(p.includes("TESOURO")){ const t=ativo.replace(/^\s*Tesouro\s*/i,"").replace(/[\s-]+$/,"").trim(); return {key:"tesouro:"+t.toLowerCase(),nome:"Tesouro "+t,classe:"Tesouro Direto"}; }
  if(/\bLC[IA]\b/.test(a)) return {key:"lcilca",nome:"LCI/LCA",classe:"Renda Fixa"};
  if(/\bCDB\b/.test(a) && (/\bINTER\b/.test(a)||/APLICAUT/.test(a))) return {key:"cdbinter",nome:"CDB Inter",classe:"Renda Fixa"};
  if(/\b(CDB|RDB|LC)\b/.test(a)) return {key:"cdboutros",nome:"CDB de outros emissores",classe:"Renda Fixa"};
  return {key:"outros",nome:"Outros títulos",classe:"Renda Fixa"};
}
function parseInterExtrato(pages){
  const out={periodo:null,fim:null,posicaoTotal:null,resumo:{entradas:{},saidas:{}},rows:[],avisos:[]};
  let date=null, secao=null;
  for(const pg of pages){
    const lines=interLines(pg.items); let cols=null; const anchors=[], frags=[];
    for(const L of lines){
      const t=L.text;
      let m=t.match(/movimenta\S*\s+de\s+(\d{2})\/(\d{2})\/(\d{4})\s+a\s+(\d{2})\/(\d{2})\/(\d{4})/i);
      if(m){ if(!out.periodo){ out.periodo=[`${m[3]}-${m[2]}-${m[1]}`,`${m[6]}-${m[5]}-${m[4]}`]; out.fim=out.periodo[1]; } continue; }
      if(/^CPF\b/.test(t)) continue;
      m=t.match(/^Posi\S*o Total\s*R\$\s*([\d.,]+)/i); if(m){ out.posicaoTotal=interNum(m[1]); continue; }
      if(/^Entradas$/i.test(t)){ secao="entradas"; continue; }
      if(/^Sa\S*das$/i.test(t)){ secao="saidas"; continue; }
      if(/^Movimenta\S*es$/i.test(t)){ secao=null; continue; }
      if(secao){ m=t.match(/^(.+?)\s*±?\s*R\$\s*([\d.,]+)$/); if(m){ out.resumo[secao][m[1].replace(/±/g,"").trim()]=interNum(m[2]); } continue; }
      m=t.match(/^(\d{1,2}) de ([a-zç]+) de (\d{4})$/i);
      if(m && INTER_MESES[m[2].toLowerCase()]){ date=`${m[3]}-${String(INTER_MESES[m[2].toLowerCase()]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`; continue; }
      if(/^Produto\b/.test(t) && /Quantidade/.test(t)){
        const xs=L.items; const f=(w,n=0)=>xs.filter(i=>i.s===w)[n];
        const c={prod:f("Produto").x, ativo:f("Ativo").x, cod:f("Código")?f("Código").x:f("Ativo",1).x, qtd:f("Quantidade").x, val:f("Valor").x, iof:f("IOF").x, ir:f("IR").x, liq:f("Valor",1).x};
        cols=c; continue;
      }
      if(!cols||!date) continue;
      const col=x=>{ const e=x+2; return e<cols.ativo?"prod":e<cols.cod?"ativo":e<cols.qtd?"cod":e<cols.val?"qtd":e<cols.iof?"val":e<cols.ir?"iof":e<cols.liq?"ir":"liq"; };
      const byCol={}; L.items.forEach(i=>{ (byCol[col(i.x)] ||= []).push(i); });
      const hasVal=(byCol.val||[]).some(i=>/R\$/.test(i.s));
      if(hasVal) anchors.push({y:L.y,date,byCol});
      else if(Object.keys(byCol).every(k=>k==="prod"||k==="ativo"||k==="cod")) frags.push({y:L.y,date,byCol});
    }
    // Nomes de ativo quebrados em várias linhas: agrupa linhas próximas (espaço de uma linha de texto) em torno da linha principal
    const seq=[...anchors.map(a=>({...a,anchor:true})),...frags].sort((p,q)=>q.y-p.y);
    const clusters=[]; let cur=null;
    for(const it of seq){ if(cur && cur.last-it.y<=13 && cur.date===it.date){ cur.list.push(it); cur.last=it.y; } else { cur={list:[it],last:it.y,date:it.date}; clusters.push(cur); } }
    const anc=new Map(anchors.map(a=>[a.y+"|"+a.date,a]));
    for(const c of clusters){
      const as=c.list.filter(i=>i.anchor).map(i=>anc.get(i.y+"|"+i.date));
      for(const f of c.list.filter(i=>!i.anchor)){
        let pool=as.length?as:anchors.filter(a=>a.date===f.date); let best=null,bd=1e9;
        for(const a of pool){ const d=Math.abs(a.y-f.y); if(d<bd){bd=d;best=a;} }
        if(best && (as.length || bd<=30)){ for(const k in f.byCol){ (best.byCol[k] ||= []).push(...f.byCol[k]); } }
      }
    }
    for(const a of anchors){
      const txt=k=>(a.byCol[k]||[]).slice().sort((p,q)=>q.y-p.y||p.x-q.x).map(i=>i.s).join(" ").replace(/\u0000/g,"").replace(/\s+/g," ").trim();
      const qItems=a.byCol.qtd||[];
      const neg=qItems.some(i=>i.s.includes("\u0000")||/^-/.test(i.s.trim()));
      const qtd=interNum(qItems.map(i=>i.s).join(""));
      const valor=interNum(txt("val")), liq=interNum(txt("liq"));
      const produto=txt("prod"), ativo=txt("ativo"), codigo=txt("cod").replace(/\s+/g,"");
      if(!isFinite(valor)){ out.avisos.push(`Linha sem valor em ${a.date}`); continue; }
      out.rows.push({data:a.date,produto,ativo,codigo,tipo:neg?"resgate":"aplicacao",qtd:isFinite(qtd)?qtd:null,valor,liquido:isFinite(liq)?liq:valor,ir:txt("ir"),iof:txt("iof")});
    }
  }
  out.rows.sort((a,b)=>a.data.localeCompare(b.data));
  return out;
}
/* Converte as movimentações em lançamentos diários por tipo de investimento */
function interPorTipo(rows){
  const grupos={};
  const custo={}; // por código: {un, cpu}
  for(const r of rows){
    const tp=interTipo(r.produto,r.ativo);
    const g=(grupos[tp.key] ||= {...tp,dias:{},aplicado:0,resgatado:0,ganho:0,n:0,codigos:new Set(),semCusto:0});
    const valido=r.codigo&&r.codigo.replace(/[^A-Z0-9]/gi,"").length>=6;
    const ck=valido?r.codigo:tp.key+"|sem-codigo|"+r.ativo;
    g.codigos.add(ck); g.n++;
    const c=(custo[ck] ||= {un:0,val:0,grupo:tp.key});
    const d=(g.dias[r.data] ||= {data:r.data,fluxo:0,ganho:0});
    if(r.tipo==="aplicacao"){
      c.un+=r.qtd||0; c.val+=r.valor; d.fluxo+=r.valor; g.aplicado+=r.valor;
    } else {
      let principal;
      const orf=custo[tp.key+"|sem-codigo|"+r.ativo];
      if(!(c.un>0) && orf && orf.un>0 && r.qtd){ const u=Math.min(r.qtd,orf.un); principal=orf.val*(u/orf.un); orf.val-=principal; orf.un-=u; if(orf.un<1e-9){orf.un=0;orf.val=0;} }
      else if(c.un>0 && r.qtd){ const u=Math.min(r.qtd,c.un); principal=c.val*(u/c.un); c.val-=principal; c.un-=u; if(c.un<1e-9){c.un=0;c.val=0;} }
      else { principal=r.valor; g.semCusto++; }
      d.fluxo-=r.valor; d.ganho+=r.valor-principal; g.resgatado+=r.valor; g.ganho+=r.valor-principal;
    }
    d.custo=Object.values(custo).filter(x=>x.grupo===tp.key).reduce((s,x)=>s+x.val,0);
  }
  for(const g of Object.values(grupos)){
    g.lista=Object.values(g.dias).sort((a,b)=>a.data.localeCompare(b.data)).map(d=>({data:d.data,aporte:Math.round(d.fluxo*100)/100,saldo:Math.max(0,Math.round(d.custo*100)/100),ganho:d.ganho}));
    g.saldoFinal=g.lista.length?g.lista[g.lista.length-1].saldo:0;
    g.codigos=g.codigos.size;
  }
  return Object.values(grupos).sort((a,b)=>b.aplicado-a.aplicado);
}

function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error("load")); document.head.appendChild(s); }); }
function loadPdfLib(){
  if(window.pdfjsLib && window.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  if(!pdfLibPromise){ const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    pdfLibPromise=loadScript(base+"pdf.min.js").then(()=>loadScript(base+"pdf.worker.min.js")).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js"; return window.pdfjsLib; })
      .catch(e=>{ pdfLibPromise=null; throw e; }); }
  return pdfLibPromise;
}

async function impArquivo(file,senha){
  if(!file) return;
  if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name)){ IMP.stage="erro"; IMP.err="O arquivo precisa ser um PDF. Exporte o extrato de movimentações no app do Inter e envie o PDF."; render(); return; }
  IMP.stage="lendo"; IMP.nome=file.name; IMP.err=""; render();
  try{
    const lib=await loadPdfLib();
    const buf=IMP.pdf || new Uint8Array(await file.arrayBuffer()); IMP.pdf=buf; IMP.file=file;
    let doc;
    try{ doc=await lib.getDocument({data:buf.slice(0),password:senha||undefined,isEvalSupported:false,disableFontFace:true,verbosity:0}).promise; }
    catch(e){ if(e && e.name==="PasswordException"){ IMP.stage="senha"; IMP.err=senha?"Senha incorreta. Tente de novo.":""; render(); const f=document.getElementById("imp-senha"); if(f) f.focus(); return; } throw e; }
    const pages=[]; for(let i=1;i<=doc.numPages;i++){ const tc=await (await doc.getPage(i)).getTextContent(); pages.push({items:tc.items.map(t=>({s:t.str,x:t.transform[4],y:t.transform[5]}))}); }
    const res=parseInterExtrato(pages);
    if(!res.rows.length){ IMP.stage="erro"; IMP.err=/notas? de renda fixa/i.test(pages.map(p=>p.items.map(i=>i.s).join(" ")).join(" ").replace(/\s+/g," ").slice(0,3000))?"Esse arquivo é de notas de negociação. Envie o \"Extrato de movimentações\" de investimentos do Inter.":"Não encontrei movimentações nesse PDF. Confira se é o \"Extrato de movimentações\" de investimentos do Inter."; render(); return; }
    IMP.res=res; IMP.grupos=interPorTipo(res.rows); IMP.saldos={};
    const tp=impTopos(); const inter=tp.find(a=>/inter/i.test(a.nome)&&!a.imp)||tp.find(a=>/inter/i.test(a.nome));
    IMP.pai=inter?inter.id:"novo"; impDefaults();
    IMP.modo=IMP.pai!=="novo"&&[...S.assets.values()].some(a=>!a.oculto&&a.pai===IMP.pai)?"separado":"junto";
    IMP.pdf=null; IMP.stage="previa"; render();
  }catch(e){ IMP.stage="erro"; IMP.err="Não foi possível ler o PDF. Verifique a conexão e se o arquivo abre normalmente."; render(); }
}

function parseOFX(text){

  out.banco=tag(text,"ORG")||"";

  out.inicio=d8(tag(text,"DTSTART")); out.fim=d8(tag(text,"DTEND"));
  out.conta=tag(text,"ACCTID")||""; out.bancoId=tag(text,"BANKID")||"";
  const lb=text.match(/<LEDGERBAL>([\s\S]*?)<\/LEDGERBAL>/i)||text.match(/<AVAILBAL>([\s\S]*?)<\/AVAILBAL>/i);
  if(lb){ const v=Number(tag(lb[1],"BALAMT").replace(/,(\d{1,2})$/,".$1")); const d=d8(tag(lb[1],"DTASOF")); if(isFinite(v)&&d) out.saldo={valor:v,data:d}; }
  const parts=text.split(/<STMTTRN>/i).slice(1);
  for(const p0 of parts){ const p=p0.split(/<\/STMTTRN>/i)[0];
    const amt=Number(tag(p,"TRNAMT").replace(/\s/g,"").replace(/,(\d{1,2})$/,".$1"));
    const data=d8(tag(p,"DTPOSTED"));
    if(!data||!isFinite(amt)) continue;
    out.tx.push({tipo:tag(p,"TRNTYPE").toUpperCase(),data,valor:amt,fitid:tag(p,"FITID"),memo:tag(p,"MEMO").replace(/&quot;/g,'"').replace(/&amp;/g,"&"),nome:tag(p,"NAME").replace(/&amp;/g,"&")});
  }
  out.tx.sort((a,b)=>a.data.localeCompare(b.data));
  return out;
}

/* Classifica uma transação: {acao:"gasto"|"ignorar", cat, motivo, pag} */
function ofxClassifica(t,opts){
  const memo=ofxNorm(t.memo), nome=ofxNorm(t.nome), txt=memo+" "+nome, dono=ofxNorm(opts&&opts.dono||"").trim();
  if(t.valor>=0) return {acao:"ignorar",motivo:"Entrada de dinheiro"};
  if(/^(APLICACAO|DEBITO RENDA FIXA|DEBITO TESOURO|DEBITO RF|APLIC)/.test(memo)) return {acao:"ignorar",motivo:"Aplicação em investimento"};
  if(/RECEBIDO DEVOLVIDO/.test(memo)) return {acao:"ignorar",motivo:"Devolução de Pix recebido"};
  if(dono && nomeIgual(nome,dono)) return {acao:"ignorar",motivo:"Transferência entre suas contas"};
  const pag=/^PIX/.test(memo)?"Pix":/DEBITO|COMPRA/.test(memo)?"Débito":/PAGAMENTO|CONVENIO|BOLETO/.test(memo)?"Boleto":"Débito";
  if(/FATURA/.test(txt)) return {acao:"gasto",cat:"cartao",pag:"Boleto"};
  for(const [cat,re] of OFX_REGRAS) if(re.test(txt)) return {acao:"gasto",cat,pag};
  if(/^PIX/.test(memo) && nome && !OFX_EMPRESA.test(nome)) return {acao:"gasto",cat:"transferencias",pag};
  return {acao:"gasto",cat:"outros",pag};
}

function nomeChave(n){ return ofxNorm(n||"").replace(/[^A-Z ]/g," ").split(/\s+/).filter(w=>w&&!/^(DE|DA|DO|DAS|DOS|E|D)$/.test(w)).join(" "); }

/* Descobre o nome do titular: quem mais aparece tanto recebendo quanto enviando Pix */
function ofxAdivinhaDono(tx){
  /* Pistas fortes do titular: o nome no "Pagamento fatura" e um mesmo nome usando contas de bancos diferentes (códigos "Cp :" distintos).

  const D={}, reg=(nome,orig)=>{ const k=nomeChave(nome); if(!k||k.split(" ").length<2) return null; return (D[k] ||= {env:0,rec:0,cps:new Set(),fat:0,orig}); };
  tx.forEach(t=>{ const m=ofxNorm(t.memo), nm=ofxNorm(t.nome);
    if(/FATURA/.test(m+" "+nm)){ const f=String(t.nome||"").split(/\s+-\s+/).pop(); const x=f&&f!==t.nome?reg(f,f):null; if(x) x.fat++; return; }
    const x=reg(t.nome,t.nome); if(!x) return;
    if(/^PIX ENVIADO/.test(m)) x.env++; if(/^PIX RECEBIDO/.test(m)) x.rec++;

}
/* Nomes que podem ser do titular, para a pessoa confirmar (quem só troca Pix com você também aparece aqui) */
function ofxCandidatosDono(tx){

  tx.forEach(t=>{ const m=ofxNorm(t.memo), nm=ofxNorm(t.nome);
    if(/FATURA/.test(m+" "+nm)){ const f=String(t.nome||"").split(/\s+-\s+/).pop(); const x=f&&f!==t.nome?reg(f):null; if(x) x.fat++; return; }

const ymAdd=(ym,n)=>{ let [y,m]=ym.split("-").map(Number); m+=n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,"0")}`; };

const addDias=(iso,n)=>{ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const pgVenc=(b,ym)=>b.rep==="unica"&&b.data?b.data:`${ym}-${String(Math.min(b.dia||1,daysIn(ym))).padStart(2,"0")}`;
const pgCriadoYm=b=>b.criado?new Date(b.criado).toISOString().slice(0,7):"0000-00";
function pgAtiva(b,ym){
  if(b.rep==="unica") return (b.data||"").slice(0,7)===ym;
  if(ym<b.ini) return false;
  if(b.rep==="parcelas") return ymDiff(b.ini,ym)<(b.parc||1);
  return !b.fim||ym<=b.fim;

/* Calcula as contas de um intervalo de meses, ligando cada uma a no máximo um gasto. */
function pgCalc(de,ate){
  const hoje=todayISO(); const bills=[...S.pagar.values()];
  const insts=[]; for(let m=de;m<=ate;m=ymAdd(m,1)) bills.forEach(b=>{ if(pgAtiva(b,m)) insts.push({b,ym:m,venc:pgVenc(b,m),key:`${b.id}|${m}`}); });
  insts.sort((x,y)=>x.venc.localeCompare(y.venc));
  const usados=new Set(); S.pagtos.forEach(p=>{ if(p.pago&&p.gasto) usados.add(p.gasto); });
  const gastos=[...S.gastos.values()];
  const ultimoValor={};
  for(const it of insts){
    const b=it.b, p=S.pagtos.get(`pp_${b.id}_${it.ym}`), rej=new Set((p&&p.rej)||[]);
    it.p=p; it.n=b.rep==="parcelas"?ymDiff(b.ini,it.ym)+1:null;
    it.antes=it.ym<pgCriadoYm(b)&&!(p&&p.pago);
    const est=b.variavel&&ultimoValor[b.id]?ultimoValor[b.id]:b.valor;
    if(p&&p.pago){ it.st="pago"; it.valor=p.valor; it.pagoEm=p.data; it.fonte=p.gasto?"vinculo":"manual"; it.gasto=p.gasto?S.gastos.get(p.gasto):null; }
    else if(b.chave){
      const ch=ofxNorm(b.chave), ini=addDias(it.venc,-25), fim=addDias(it.venc,20);
      const cand=gastos.filter(g=>!usados.has(g.id)&&!rej.has(g.id)&&g.data>=ini&&g.data<=fim&&ofxNorm(g.desc).includes(ch)&&(b.variavel||Math.abs(g.valor-b.valor)<=Math.max(3,b.valor*.2)))
        .sort((x,y)=>Math.abs(diasEntre(x.data,it.venc))-Math.abs(diasEntre(y.data,it.venc)))[0];
      if(cand){ usados.add(cand.id); it.st="pago"; it.valor=cand.valor; it.pagoEm=cand.data; it.fonte="extrato"; it.gasto=cand; }
    }
    if(it.st==="pago"){ ultimoValor[b.id]=it.valor; continue; }
    it.valor=est;
    const dd=diasEntre(hoje,it.venc)-1; it.dias=dd;
    it.st=dd<0?"atrasada":dd===0?"hoje":dd<=7?"breve":"futura";
    // sugestão: gasto com valor quase igual perto do vencimento
    if(!it.antes){ const ini=addDias(it.venc,-12), fim=addDias(it.venc,12);

        .sort((x,y)=>Math.abs(x.valor-it.valor)-Math.abs(y.valor-it.valor)||Math.abs(diasEntre(x.data,it.venc))-Math.abs(diasEntre(y.data,it.venc)))[0]||null;
      if(it.sug&&PG.ign.has(it.key+"|"+it.sug.id)) it.sug=null; }
  }
  return insts;
}
function pgMesDados(ym){

}
function pgSugestoes(){

function pgAchaInst(key){ const [id,ym]=key.split("|"); return pgCalc(ymAdd(ym,-1),ym).find(i=>i.key===key)||null; }
async function pgPagar(key){

  const p={...(it.p||{}),kind:"pagto",id:`pp_${b.id}_${it.ym}`,conta:b.id,mes:it.ym,pago:true,valor,data:d};

const RD_TIPOS={rd_salario:{nome:"Salário",cat:"salario",regra:"util",dia:30,ico:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>'},

function pascoa(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1; return `${y}-${String(mes).padStart(2,"0")}-${String(dia).padStart(2,"0")}`; }

  if(["01-01","04-21","05-01","09-07","10-12","11-02","11-15","11-20","12-25"].includes(md)) return true;

/* ---------- Lembrete de importar o extrato ---------- */
function ultimaImportacao(){
  let ult=0; const ver=d=>{ if(d.imp&&String(d.imp).startsWith("gimp_")){ const t=+String(d.imp).slice(5); if(t>ult) ult=t; } };
  S.gastos.forEach(ver); S.entradas.forEach(ver);
  S.contas.forEach(c=>{ if(c.origem==="extrato"&&c.data){ const t=new Date(c.data+"T12:00:00").getTime(); if(t>ult) ult=t; } });
  return ult||null;
}
function vLembreteImport(){
  const ult=ultimaImportacao(); if(!ult) return "";
  const dias=Math.floor((Date.now()-ult)/864e5); if(dias<7) return "";
  let adiado=null; try{ adiado=localStorage.getItem("diario-lembrete-adiado"); }catch{}
  if(adiado===todayISO()) return "";
  return `<section class="lb-imp" role="status">
    <span class="lb-ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>
    <div class="lb-t"><b>Hora de importar o extrato</b><span>O último foi importado há ${dias} dias, em ${dBR(new Date(ult).toISOString().slice(0,10))}. Importe o novo para manter gastos, entradas e saldo em dia.</span></div>
    <div class="lb-a"><button class="btn sm primary" data-act="lb-importar">Importar agora</button><button class="btn sm ghost" data-act="lb-adiar">Lembrar amanhã</button></div>
  </section>`;
}

/* ---------- Saldo real: base do banco + o que você lançou depois ---------- */
function contaPadrao(){ const cs=[...S.contas.values()].sort((a,b)=>b.saldo-a.saldo); return cs[0]||null; }
function contaDoLanc(x){ if(x.conta&&S.contas.has(x.conta)) return x.conta; const c=contaPadrao(); return c?c.id:null; }
function depoisDoSaldo(x,c){ if(x.data>c.data) return true; if(x.data<c.data) return false; return !!(c.ts&&x.criado&&x.criado>c.ts); }
function saldoConta(c){
  let menos=0, mais=0, n=0;
  S.gastos.forEach(g=>{ if(g.ext||g.pag==="Crédito"||contaDoLanc(g)!==c.id||!depoisDoSaldo(g,c)) return; menos+=g.valor; n++; });
  S.entradas.forEach(e=>{ if(e.ext||e.cat==="proprias"||contaDoLanc(e)!==c.id||!depoisDoSaldo(e,c)) return; mais+=e.valor; n++; });
  return {valor:Math.round((c.saldo-menos+mais)*100)/100,menos,mais,n};
}
const saldoTotalContas=()=>[...S.contas.values()].reduce((t,c)=>t+saldoConta(c).valor,0);

/* ---------- Autocompletar descrição do gasto ---------- */
const AC={itens:[],i:-1};
const acNorm=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function acBuscar(q){
  const nq=acNorm(q); if(nq.length<2) return [];
  const grp={};
  S.gastos.forEach(g=>{ const k=acNorm(g.desc); if(!k.includes(nq)) return; const x=(grp[k] ||= {desc:g.desc,n:0,ult:g}); x.n++; if(g.data>x.ult.data||(g.data===x.ult.data&&(g.criado||0)>(x.ult.criado||0))){ x.ult=g; x.desc=g.desc; } });

/* ---------- Celular: esconde os menus ao rolar para baixo ---------- */
(function(){
  let ultY=window.scrollY, acc=0, tick=false;
  const mq=window.matchMedia("(max-width:760px)");
  function aplicar(){
    tick=false; const y=Math.max(0,window.scrollY), d=y-ultY; ultY=y;
    if(!mq.matches||y<60||document.body.classList.contains("bs-on")){ document.body.classList.remove("nav-off"); acc=0; return; }
    if((d>0&&acc<0)||(d<0&&acc>0)) acc=0; acc+=d;
    if(acc>24) document.body.classList.add("nav-off");
    else if(acc<-12) document.body.classList.remove("nav-off");
    if(window.innerHeight+y>=document.documentElement.scrollHeight-4) document.body.classList.remove("nav-off");
  }
  window.addEventListener("scroll",()=>{ if(!tick){ tick=true; requestAnimationFrame(aplicar); } },{passive:true});
  document.addEventListener("focusin",e=>{ if(e.target.matches&&e.target.matches("input,select,textarea")) document.body.classList.remove("nav-off"); });
})();

function emDados(e){
  const rs=[...S.recebs.values()].filter(r=>r.emp===e.id).sort((a,b)=>a.data.localeCompare(b.data));
  const recebido=Math.round(rs.reduce((t,r)=>t+r.valor,0)*100)/100, falta=Math.max(0,Math.round((e.valor-recebido)*100)/100);
  const hoje=todayISO(), mAtual=hoje.slice(0,7);
  const parc=e.parc>0?e.parc:0, vp=parc?Math.round(e.valor/parc*100)/100:(e.vparc||0);
  // agenda: parcelas esperadas e quanto já foi coberto (pagamentos cobrem as parcelas em ordem)
  const agenda=[]; if(e.ini&&(parc||vp)){ const n=parc||Math.ceil(e.valor/Math.max(vp,0.01)); let pago=recebido;
    for(let k=0;k<n&&k<120;k++){ const ym=ymAdd(e.ini,k); const val=k===n-1?Math.round((e.valor-vp*(n-1))*100)/100:vp; const cob=Math.min(val,Math.max(0,pago)); pago-=val;

      const st=cob>=val-0.005?"pago":cob>0?"parcial":venc<hoje?"atrasada":ym===mAtual?"mes":"futura";
      agenda.push({k:k+1,ym,venc,val,cob,st}); } }
  const prox=agenda.find(a=>a.st!=="pago")||null;
  const atr=agenda.filter(a=>a.st==="atrasada");
  return {rs,recebido,falta,vp,agenda,prox,atr,quitado:falta<=0.005};

const PJ_KEY="diario-projecao";
const PJ=(()=>{ const d={base:"atual",ini:"",aporte:null,reaj:0,taxa:"mod",taxaC:"10",inf:false,infT:"4,5",modo:"anos",anos:10,meta:"1.000.000",tab:false};

const PJ_TAXAS=[["cons","Conservador",8],["mod","Moderado",10],["arr","Arrojado",12]];
function pjHistorico(C){
  const ms=(C&&C.months||[]).filter(m=>isFinite(m.rent));
  const ult=ms.slice(-12);
  const media=ult.length>=3?Math.pow(ult.reduce((f,m)=>f*(1+m.rent),1),12/ult.length)-1:null;
  const ap=ms.slice(1).slice(-6);  // o 1º mês do histórico é o saldo inicial, não um aporte
  let apMed=ap.length?ap.reduce((t,m)=>t+m.aportes,0)/ap.length:0;
  const tot=C&&C.last?C.last.total:0; if(tot&&apMed>tot*.25) apMed=0;
  return {media:media!=null&&media>-0.5&&media<1?media:null,apMed:Math.max(0,apMed),nMeses:ult.length};
}
function pjTaxa(H){ if(PJ.taxa==="hist"&&H.media!=null) return H.media; if(PJ.taxa==="cust"){ const v=parseNum(PJ.taxaC); return v!=null?v/100:0.1; } const t=PJ_TAXAS.find(x=>x[0]===PJ.taxa); return (t?t[2]:10)/100; }
function pjSim(ini,aporte,taxaA,reajA,infA,mesesMax,metaReal){
  const rm=Math.pow(1+taxaA,1/12)-1, im=infA?Math.pow(1+infA,1/12)-1:0;
  let saldo=ini, inv=ini, ap=aporte, defl=1; const pts=[{m:0,saldo,inv,real:saldo,invReal:inv}]; let atinge=null;
  for(let m=1;m<=mesesMax;m++){
    saldo=saldo*(1+rm)+ap; inv+=ap; defl*=1+im;
    const real=saldo/defl, invReal=inv/defl;
    pts.push({m,saldo,inv,real,invReal});
    if(metaReal!=null&&atinge==null&&(infA?real:saldo)>=metaReal) atinge=m;
    if(m%12===0&&reajA) ap*=1+reajA;
  }
  return {pts,atinge,rm};
}

function rsSankey(R){

  const cs=R.cats.slice(); const NT=mob?5:8, top=cs.slice(0,NT), resto=cs.slice(NT).reduce((t,[,v])=>t+v,0);
  const dir=top.map(([c,v])=>({n:catNome(c),v,cor:catCor(c)})); if(resto>0) dir.push({n:mob?"Demais":"Demais categorias",v:resto,cor:css("--muted")});
  if(R.temE&&R.sobra>0) dir.push({n:"Sobrou",v:R.sobra,cor:css("--pos"),sobra:true});
  const esq=[]; if(R.temE) esq.push({n:"Entrou",v:R.E,cor:css("--accent")}); if(!R.temE||R.sobra<0) esq.push({n:R.temE?"Saiu da reserva":"Gastos",v:R.temE?-R.sobra:R.G,cor:R.temE?css("--neg"):css("--cta")});

  dir.forEach(n=>{ if(n.ly<pitch/2-4) n.ly=pitch/2-4; });

  const links=[]; let li=0, lusado=0;

      links.push({ya:L.y+lusado*kL, yb:L.y+(lusado+q)*kL, za:d.y+off*kR, zb:d.y+(off+q)*kR, cor:d.cor});
      lusado+=q; off+=q; falta-=q; if(L.v-lusado<1e-6){ li++; lusado=0; } } });
  const mx=(x1+nw+x2)/2;
  const path=l=>`M${x1+nw},${l.ya} C${mx},${l.ya} ${mx},${l.za} ${x2},${l.za} L${x2},${l.zb} C${mx},${l.zb} ${mx},${l.yb} ${x1+nw},${l.yb} Z`;
  const ink=css("--ink"), muted=css("--muted"), tx=x2+nw+(mob?6:8), nmax=mob?17:26;
  box.innerHTML=`<svg width="${W}" height="${H+4}" viewBox="0 -2 ${W} ${H+4}" xmlns="http://www.w3.org/2000/svg">
    ${links.map(l=>`<path d="${path(l)}" fill="${l.cor}" fill-opacity=".28"><title>${fmt((l.zb-l.za)/kR)}</title></path>`).join("")}
    ${esq.map(n=>`<rect x="${x1}" y="${n.y}" width="${nw}" height="${n.h}" rx="3" fill="${n.cor}"/>

      <text x="${x1-8}" y="${n.y+n.h/2+fs+1}" text-anchor="end" font-size="${fs-1}" fill="${muted}">${brlC.format(n.v)}</text>`).join("")}
    ${dir.map(n=>{ const c=n.y+n.h/2, desl=Math.abs(n.ly-c)>3;

      ${desl?`<path d="M${x2+nw+1},${c} L${tx-2},${n.ly}" stroke="${n.cor}" stroke-width="1.2" fill="none" opacity=".8"/>`:""}
      <text x="${tx}" y="${n.ly-2}" font-size="${fs}" font-weight="700" fill="${n.sobra?css("--pos"):ink}"><title>${esc(n.n)}</title>${esc(n.n.length>nmax?n.n.slice(0,nmax-1)+"…":n.n)}</text>
      <text x="${tx}" y="${n.ly+fs}" font-size="${fs-1}" fill="${muted}">${brlC.format(n.v)} · ${pct(n.v/T).replace("+","")}</text>`; }).join("")}
  </svg>`;
}

function gAvisos(){
  const hoje=todayISO(), mesAtual=hoje.slice(0,7);
  const ref=S.gPer==="mes"?S.gMes:mesAtual;
  if(ref>mesAtual) return [];
  const all=[...S.gastos.values()];
  const doMes=all.filter(g=>g.data.startsWith(ref));
  const atual=ref===mesAtual, frac=atual?Math.min(1,+hoje.slice(8,10)/daysIn(ref)):1;
  const nomeMes=atual?"este mês":"em "+mLong(ref).toLowerCase();
  const av=[];
  const cur={}; doMes.forEach(g=>cur[g.cat]=(cur[g.cat]||0)+g.valor);
  // média dos 3 meses anteriores com gastos
  const prevs=[1,2,3].map(i=>ymAdd(ref,-i)).filter(m=>all.some(g=>g.data.startsWith(m)));
  const media={}; if(prevs.length){ all.forEach(g=>{ const m=g.data.slice(0,7); if(prevs.includes(m)) media[g.cat]=(media[g.cat]||0)+g.valor/prevs.length; }); }
  const lim={}; S.orc.forEach(o=>{ if(o.cat&&o.limite>0) lim[o.cat]=o.limite; });
  const comLimite=new Set();
  Object.keys(lim).forEach(c=>{ const v=cur[c]||0, l=lim[c];
    if(v>=l){ av.push({k:"lim+"+c+ref,sev:3,cat:c,txt:`Você passou ${fmt(v-l)} do limite de <b>${catNome(c)}</b> ${nomeMes} (${fmt(v)} de ${fmt(l)}).`}); comLimite.add(c); }
    else if(atual && frac<0.95 && v/frac>l*1.05 && v>=l*0.3){ av.push({k:"proj+"+c+ref,sev:2,cat:c,txt:`No ritmo atual, <b>${catNome(c)}</b> deve fechar o mês perto de ${fmt(v/frac)}, acima do limite de ${fmt(l)}.`}); comLimite.add(c); }
    else if(v>=l*0.8){ av.push({k:"quase+"+c+ref,sev:2,cat:c,txt:`Faltam ${fmt(l-v)} para atingir o limite de <b>${catNome(c)}</b> (${pct(v/l).replace("+","")} usado).`}); comLimite.add(c); }
  });
  Object.keys({...cur,...media}).forEach(c=>{ if(comLimite.has(c)||c==="cartao") return; const v=cur[c]||0, base=(media[c]||0)*frac;
    if(base>=30 && v>base*1.3 && v-base>=50) av.push({k:"alta+"+c+ref,sev:2,cat:c,val:v-base,txt:`<b>${catNome(c)}</b> está ${pct(v/base-1).replace("+","")} acima da sua média ${atual?"para esta altura do mês":"dos meses anteriores"}: ${fmt(v)} contra ${fmt(base)}.`});
    else if(base>=80 && v<base*0.7 && base-v>=80 && (!atual||frac>0.5)) av.push({k:"baixa+"+c+ref,sev:0,cat:c,val:base-v,txt:`Boa! <b>${catNome(c)}</b> está ${pct(1-v/base).replace("+","")} abaixo da sua média: ${fmt(v)} contra ${fmt(base)}.`});
  });
  limGeraisStatus(ref).forEach(x=>{
    if(x.st==="neg") av.push({k:"lg+"+x.t+(x.t==="dia"?todayISO():x.t==="semana"?inicioSemana(todayISO()):ref),sev:3,txt:`Limite geral ${x.t==="dia"?"do dia":x.t==="semana"?"da semana":"do mês"} estourado: ${fmt(x.gasto)} de ${fmt(x.lim)} (${fmt(x.gasto-x.lim)} acima).`});
    else if(x.st==="warn") av.push({k:"lgw+"+x.t+(x.t==="dia"?todayISO():x.t==="semana"?inicioSemana(todayISO()):ref),sev:2,txt:`Você já usou ${pct(x.uso).replace("+","")} do limite geral ${x.t==="dia"?"de hoje":x.t==="semana"?"da semana":"do mês"}. Restam ${fmt(x.lim-x.gasto)}.`});
  });
  const E=[...S.entradas.values()].filter(e=>e.cat!=="proprias"&&dataMes(e).startsWith(ref)).reduce((s,e)=>s+e.valor,0), G=doMes.reduce((s,g)=>s+g.valor,0);
  if(E>0){ if(G>E) av.push({k:"saldo-"+ref,sev:3,txt:`${atual?"Até agora, este mês":"Em "+mLong(ref)}, você gastou ${fmt(G-E)} a mais do que entrou (${fmt(G)} de gastos para ${fmt(E)} de entradas).`});
    else if(!atual||frac>=0.6) av.push({k:"saldo+"+ref,sev:0,txt:`${atual?"Até agora sobraram":"Em "+mLong(ref)+" sobraram"} ${fmt(E-G)}, ou ${pct((E-G)/E).replace("+","")} do que entrou.`}); }
  if(doMes.length>=5){ const vs=doMes.map(g=>g.valor).sort((a,b)=>a-b), med=vs[Math.floor(vs.length/2)]; const mx=doMes.reduce((a,b)=>b.valor>a.valor?b:a);

        <input class="inp money" id="ctaj_v" inputmode="decimal" placeholder="Valor, ex.: 22,00" required aria-label="Valor"><input class="inp" id="ctaj_d" maxlength="60" placeholder="Descrição (opcional)" aria-label="Descrição">
