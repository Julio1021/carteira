<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário da Carteira</title>
<meta name="description" content="Controle dos seus investimentos e gastos">
<meta name="theme-color" content="#0f5c55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carteira">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de navegação fixa no topo, painel com KPIs → gráficos em grade de 12 colunas; abas para Lançar, Ativos e Relatórios */
:root{
  /* Tema padrão (Petróleo & Laranja). Os demais temas trocam estes tokens via script. */
  --bg:#242424; --surface:#183936; --surface-2:#214743; --ink:#ffffff; --ink-2:#d3e6e2; --muted:#93b3ad;
  --line:#2d5550; --accent:#2fbfa6; --accent-ink:#0b2421; --accent-soft:#1d4d47;
  --pos:#3fd0b5; --pos-soft:#12443e; --neg:#f08a55; --neg-soft:#4a2c20; --focus:#f08a55;
  --card:linear-gradient(160deg,#1c433f,#152f2c); --card-alt:linear-gradient(160deg,#4a3128,#2f211c); --card-alt-ink2:#e9cbbb;
  --hero:linear-gradient(135deg,#13897a,#0f5c55); --hero-ink:#ffffff; --hero-ink2:#e3f3f0;
  --top:#0f5c55; --top-ink:#ffffff; --tabs-bg:rgba(0,0,0,.22); --tab-on:#e07a45; --tab-on-ink:#ffffff;
  --cta:#e07a45; --cta-ink:#ffffff; --second:#e07a45; --input:#122b28; --banner:#3a2a23;
  --s1:#2fbfa6; --s2:#e07a45; --s3:#f2d7a6; --s4:#7fd6c6; --s5:#f4a582; --s6:#5b9bea; --s7:#c9a7d6; --s8:#e8c547;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.tnum{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:32px;height:32px;border-radius:9px;background:var(--cta);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
nav.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;overflow-x:auto;max-width:100%}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--pos)} .sync.local i{background:var(--s4)}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px}

/* Hero / KPIs */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:20px;align-items:stretch}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,5vw,46px);letter-spacing:-.02em;line-height:1.05;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)} .pill.neu{background:var(--surface-2);color:var(--ink-2)}
.hero-main .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-2);font-size:13px}
.hero-main .meta{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.pos-t{color:var(--pos)} .neg-t{color:var(--neg)}

/* Grid of charts */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-5{grid-column:span 5}
@media (max-width:900px){.span-8,.span-4,.span-6,.span-7,.span-5{grid-column:span 12}}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.005em}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:240px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--second) 0 4px,transparent 4px 7px)!important}

/* Allocation bars */
.alloc{display:flex;flex-direction:column;gap:12px}
.alloc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.alloc-row .n{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.alloc-row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloc-row .p{font-variant-numeric:tabular-nums;font-weight:700}
.alloc-row .bar{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.alloc-row .bar b{display:block;height:100%;border-radius:4px}
.alloc-row .sub{grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.logo{--s:28px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.28);background:#fff;flex:none;display:inline-grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1.5px var(--c),0 2px 6px rgba(0,0,0,.18)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.lg{--s:36px}.logo.sm{--s:20px;box-shadow:0 0 0 1px var(--c)}
.logo-ed{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo-ed .prev{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:var(--surface-2);border:1px dashed var(--line);color:var(--muted);font-size:10px;text-align:center;line-height:1.1;flex:none}
.logo-ed .prev.tem{background:#fff;border:0;box-shadow:0 0 0 1.5px var(--line)}
.logo-ed .prev img{width:100%;height:100%;object-fit:contain}
.logo-ed label.btn{cursor:pointer}
.logo-ed .hint{flex-basis:100%}

/* Tables */
.tbl-wrap{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums}
th.r,td.r{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.money{text-align:right;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--neg)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}

/* Lançamento */
.entry-head{display:flex;gap:16px;align-items:end;flex-wrap:wrap;justify-content:space-between}
.entry-list{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 160px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.entry.head{padding:0 0 8px}
.entry.head div{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.entry .nm{display:flex;gap:10px;align-items:center;min-width:0}
.entry .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .nm small{color:var(--muted);font-size:12px}
.entry .last{font-size:13px;color:var(--ink-2)}
.entry .last small{display:block;color:var(--muted);font-size:11.5px}
.entry .delta{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.copy{border:0;background:none;color:var(--accent);font-weight:700;font-size:11.5px;cursor:pointer;padding:0}
@media (max-width:760px){
  .entry{grid-template-columns:1fr 1fr;row-gap:8px}
  .entry.head{display:none}
  .entry .nm{grid-column:1/-1}
  .entry .last{grid-column:1/-1}
  .entry .delta{grid-column:1/-1;text-align:left}
  .entry .lbl{display:block!important}
}
.entry .lbl{display:none;font-size:11px;color:var(--muted);margin-bottom:3px}
.hint{font-size:12.5px;color:var(--muted)}
.savebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}

/* Ativos */
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.asset{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.asset .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.asset .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);padding:2px 7px;border-radius:5px}
.asset .v{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.asset .confirm{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--neg);flex-wrap:wrap}

/* Empty state */
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;padding:32px}
@media (max-width:760px){.empty{grid-template-columns:1fr;padding:22px}}
.empty h1{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em;text-wrap:balance}
.empty p{color:var(--ink-2);margin:0 0 16px;max-width:52ch}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-weight:500;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;font-size:12px}
.steps b{display:block}
.steps span{color:var(--muted);font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Camada de tema (vem por último para prevalecer) ---- */
.top{background:var(--top);border-bottom:1px solid rgba(127,127,127,.15)}
.brand b{color:var(--top-ink)} .brand small{color:var(--top-ink);opacity:.72}
nav.tabs{background:var(--tabs-bg)}
nav.tabs button{color:var(--top-ink);opacity:.82}
nav.tabs button[aria-selected="true"]{background:var(--tab-on);color:var(--tab-on-ink);opacity:1}
.sync{color:var(--top-ink);opacity:.8}
.card,.kpi{background:var(--card)}
.hero-main{background:var(--hero);border-color:transparent;color:var(--hero-ink)}
.hero-main .eyebrow,.hero-main .row,.hero-main .meta{color:var(--hero-ink2)}
.hero-main .meta{border-top-color:color-mix(in srgb,var(--hero-ink2) 35%,transparent)}
.hero-main .meta b{color:var(--hero-ink)}
.kpi:nth-child(2n){background:var(--card-alt)}
.kpi:nth-child(2n) .eyebrow,.kpi:nth-child(2n) .s{color:var(--card-alt-ink2)}
.inp,.asset{background:var(--input)}
.chip{background:transparent}
.chip[aria-pressed="true"],.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn{background:transparent}
.btn:hover{background:var(--accent-soft)}
.btn.primary:hover{background:var(--cta);filter:brightness(1.08)}
.banner{background:var(--banner);color:var(--ink)}
.toast{background:var(--cta);color:var(--cta-ink)}
tbody tr:hover td{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tag{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.steps li{background:color-mix(in srgb,var(--ink) 5%,transparent)}

/* Seletor de temas */
.theme-wrap{position:relative}
.theme-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--top-ink) 25%,transparent);background:var(--tabs-bg);color:var(--top-ink);border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer}
.theme-btn .sw{display:inline-flex}
.theme-btn .sw i{width:12px;height:12px;border-radius:50%;margin-left:-4px;border:2px solid var(--top)}
.theme-btn .sw i:first-child{margin-left:0}
.theme-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(420px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.28);padding:14px;z-index:40}
.theme-pop{max-height:min(72vh,620px);overflow-y:auto}
.theme-sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.theme-pop h3{margin:0 0 2px;font-family:var(--f-display);font-size:16px}
.theme-pop p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.theme-opt{border:2px solid var(--line);border-radius:11px;padding:0;overflow:hidden;cursor:pointer;text-align:left;background:none}
.theme-opt[aria-checked="true"]{border-color:var(--accent)}
.theme-opt .pv{height:46px;display:grid;grid-template-columns:1.2fr 1fr;gap:5px;padding:7px}
.theme-opt .pv span{border-radius:6px}
.theme-opt .pv .r{display:grid;grid-template-rows:1fr 1fr;gap:5px}
.theme-opt .lb{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.theme-opt .lb small{font-weight:500;color:var(--muted);font-size:11px}
@media (max-width:640px){.theme-wrap{position:static}.theme-pop{left:16px;right:16px;width:auto}}

.asset.edit{gap:10px;border-color:var(--accent)}
.cores{display:flex;gap:6px;flex-wrap:wrap}
.cor{position:relative;cursor:pointer}
.cor input{position:absolute;opacity:0;width:1px;height:1px}
.cor span{display:block;width:24px;height:24px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.cor input:checked+span{border-color:var(--ink)}
.cor input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.cores-g{display:flex;flex-direction:column;gap:6px}
.cores-g small{font-size:11px;color:var(--muted)}
.row-mini{display:flex;gap:6px;flex-wrap:wrap}
.share{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.share b{display:block;height:100%;border-radius:3px}
.corsel{position:relative}
.corsel summary{list-style:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:600;color:var(--ink-2);user-select:none}
.corsel summary::-webkit-details-marker{display:none}
.corsel summary .cur{width:16px;height:16px;border-radius:50%;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/8px 8px;border:1px solid var(--line)}
.corsel[open] summary svg{transform:rotate(180deg)}
.corsel .cores-g{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:420px}

/* ---- Gastos ---- */
.mes-nav{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.mes-nav b{min-width:128px;text-align:center;font-size:13.5px}
.mes-nav .nav{color:var(--ink-2)} .mes-nav .nav:hover{color:var(--ink);background:var(--accent-soft)}

.pg-grp h3{display:flex;align-items:baseline;gap:8px;margin:0 0 2px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pg-grp h3 span{letter-spacing:0;text-transform:none;font-family:inherit;font-weight:500}
.pg-grp.g-atrasada h3{color:var(--neg)}
.pg-grp.g-hoje h3{color:var(--ink)}
details.pg-grp summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
details.pg-grp summary::-webkit-details-marker{display:none}
details.pg-grp summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin-left:2px;transition:transform .2s}
details.pg-grp[open] summary::after{transform:rotate(45deg)}
.pg-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto 32px;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pg-grp .pg-row:last-child{border-bottom:0}
.pg-dt{grid-column:1;width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--ink-2)}
.pg-dt b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.pg-dt span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.st-atrasada .pg-dt{background:var(--neg-soft)} .st-atrasada .pg-dt b,.st-atrasada .pg-dt span{color:var(--neg)}
.st-hoje .pg-dt{background:var(--cta)} .st-hoje .pg-dt b,.st-hoje .pg-dt span{color:var(--cta-ink)}
.st-breve .pg-dt{background:var(--accent-soft)}
.st-pago .pg-dt{background:var(--pos-soft)} .st-pago .pg-dt b,.st-pago .pg-dt span{color:var(--pos)}
.pg-main{grid-column:2;min-width:0;display:flex;flex-direction:column;gap:2px}
.pg-nm{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-st{font-size:12.5px;color:var(--ink-2);font-weight:600}
.pg-meta{color:var(--muted);font-weight:500}
.st-atrasada .pg-st{color:var(--neg)}
.st-hoje .pg-st{color:var(--ink);font-weight:800}
.st-pago .pg-st{color:var(--pos)}
.st-pago .pg-nm,.st-pago .pg-v{color:var(--ink-2)}
.pg-row.ant .pg-nm::after{content:" · mês anterior";font-weight:500;color:var(--muted);font-size:12px}
.pg-r{grid-column:3;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.pg-v{font-family:var(--f-display);font-size:16px;white-space:nowrap}
.pg-ed{grid-column:4}
.pg-ok{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--pos-soft);color:var(--pos);font-weight:800;font-size:12px;border-radius:999px;padding:6px 11px;cursor:pointer}
.pg-ok:hover{filter:brightness(1.05)}
.pg-sug{grid-column:2/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:4px}
.pg-sug>svg{color:var(--accent);flex:none}
.pg-sug>span:first-of-type{flex:1 1 220px}
.pg-pay{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;background:var(--surface-2);border-radius:12px;padding:12px;margin-top:6px}
.pg-pay .field{width:170px}
.pg-pay .chk{align-self:center}
.pg-full{flex-basis:100%;margin:0}
.pg-perto{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pg-vazio{margin:12px 0 0}
.pg-ver-sug{margin-top:12px}
.pg-empty{display:flex;gap:14px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:16px}
.pg-empty-ico{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.pg-empty b{font-size:15px}
.pg-empty p{margin:4px 0 0;color:var(--ink-2);font-size:13px;line-height:1.5}
.pg-sugs{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.pg-sugs h3{margin:0 0 8px;font-size:13.5px}
.pg-sugs h3 span{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.pg-sugs-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-bottom:6px}
.pg-s{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:9px 10px}
.pg-s>div{min-width:0;display:flex;flex-direction:column}
.pg-s b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-s small{font-size:12px;color:var(--muted)}
.pg-form{background:var(--surface-2);border-radius:14px;padding:16px;margin:0 0 14px}
.pg-form-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pg-form-h h3{margin:0;font-family:var(--f-display);font-size:16px}
.pg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pg-span2{grid-column:span 2}.pg-span3{grid-column:1/-1}
.pg-grid .inp{background:var(--surface)}
.pg-grid .field small{font-weight:500;color:var(--muted)}
.lbl-f{font-size:12px;font-weight:600;color:var(--ink-2)}
.pg-seg{align-self:flex-start}
.seg-r{position:relative}
.seg-r input{position:absolute;opacity:0;pointer-events:none}
.seg-r span{display:inline-block;color:var(--ink-2);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg-r input:checked+span{background:var(--cta);color:var(--cta-ink);box-shadow:var(--shadow)}
.seg-r input:focus-visible+span{outline:2px solid var(--focus);outline-offset:1px}
.pg-form[data-rep="mensal"] .so-parc,.pg-form[data-rep="mensal"] .so-unica,
.pg-form[data-rep="parcelas"] .so-mens,.pg-form[data-rep="parcelas"] .so-unica,
.pg-form[data-rep="unica"] .so-rec,.pg-form[data-rep="unica"] .so-parc,.pg-form[data-rep="unica"] .so-mens{display:none}
.pg-form-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.pg-conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.pg-mini .card-h{margin-bottom:6px}
.pg-mini .card-h p b{color:var(--ink)}
.pg-mini .pg-row{grid-template-columns:46px minmax(0,1fr) auto}
.pg-mini .pg-row:last-child{border-bottom:0}
.pg-mini.tem-atr{border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.pg-tudo{display:flex;align-items:center;gap:8px;color:var(--pos);font-weight:700;font-size:13px;background:var(--pos-soft);border-radius:10px;padding:10px 12px}
@media (max-width:640px){
  .pg-h-r{width:100%;justify-content:space-between}
  .pg-h-r .mes-nav b{min-width:104px}
  .pg-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pg-span2,.pg-span3{grid-column:1/-1}
  .pg-row{grid-template-columns:46px minmax(0,1fr) 32px}
  .pg-dt{grid-row:1/span 2;align-self:start}
  .pg-ed{grid-column:3;grid-row:1}
  .pg-r{grid-column:2/-1;grid-row:2;justify-content:space-between}
  .pg-mini .pg-row{grid-template-columns:46px minmax(0,1fr) auto}
  .pg-mini .pg-r{grid-column:3;grid-row:1/span 2;flex-direction:column;align-items:flex-end;gap:6px}
  .pg-sug,.pg-pay{grid-column:1/-1}
  .pg-pay .field{width:calc(50% - 7px)}
  .pg-k b{font-size:19px}.pg-k.falta b{font-size:21px}
  .pg-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pg-k.falta,.pg-k.conta{grid-column:1/-1}
}

/* Navegação por meses */
.mx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mx-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mx-tit{display:flex;align-items:center;gap:10px;min-width:0}
.mx-tit h2{margin:1px 0 0;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mx-tag{font-family:var(--f-body,inherit);font-size:11.5px;font-weight:700;letter-spacing:0;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:3px 9px}
.mx-tag.on{background:var(--accent-soft);color:var(--accent)}
.mx-tag.warn{background:color-mix(in srgb,var(--cta) 16%,transparent);color:var(--cta)}
.rs-parcial,.fx-parcial{display:flex;align-items:center;gap:12px;border:1px solid color-mix(in srgb,var(--cta) 45%,transparent);background:color-mix(in srgb,var(--cta) 10%,transparent);border-radius:12px;padding:10px 12px;margin:2px 0 14px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.rs-parcial>svg{flex:none;color:var(--cta)} .rs-parcial p{margin:0;flex:1} .fx-parcial>span{flex:1}
.rs-parcial .btn,.fx-parcial .btn{flex:none;white-space:nowrap}
@media (max-width:600px){ .rs-parcial,.fx-parcial{flex-wrap:wrap} .rs-parcial p{flex-basis:calc(100% - 32px)} .rs-parcial .btn,.fx-parcial .btn{margin-left:auto} }
.mx-arrow{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.mx-arrow:hover{background:var(--accent-soft)}
.mx-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mx-hoje{border-color:var(--accent);color:var(--accent)}
.mx-datas{padding:2px 0}
.mx-datas label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.mx-wrap{position:relative;margin:0 -16px}
.mx-wrap::before,.mx-wrap::after{content:"";position:absolute;top:0;bottom:0;width:22px;z-index:1;pointer-events:none}
.mx-wrap::before{left:0;background:linear-gradient(90deg,var(--surface),transparent)}
.mx-wrap::after{right:0;background:linear-gradient(-90deg,var(--surface),transparent)}
.mx-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;scroll-snap-type:x proximity;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.mx-c{flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 7px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;position:relative;scroll-snap-align:center}
.mx-c:hover{background:var(--surface-2)}
.mx-y{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);height:12px;line-height:12px}
.mx-bar{width:14px;height:40px;border-radius:5px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.mx-bar i{display:block;width:100%;background:color-mix(in srgb,var(--accent) 60%,var(--surface-2));border-radius:5px}
.mx-m{font-weight:800;font-size:13px;text-transform:capitalize;color:var(--ink)}
.mx-v{font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mx-c.fut .mx-bar{background:transparent;border:1px dashed var(--line)}
.mx-c.fut .mx-m{color:var(--muted)}
.mx-c.in{background:var(--accent-soft)}
.mx-c.in .mx-bar i{background:var(--accent)}
.mx-c.on{background:var(--cta);border-color:var(--cta);box-shadow:var(--shadow)}
.mx-c.on .mx-m,.mx-c.on .mx-v,.mx-c.on .mx-y{color:var(--cta-ink)}
.mx-c.on .mx-bar{background:color-mix(in srgb,var(--cta-ink) 22%,transparent)}
.mx-c.on .mx-bar i{background:var(--cta-ink)}
.mx-dot{position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mx-c.on .mx-dot{background:var(--cta-ink)}
.mx-c:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mx .seg-b .sm{display:none}
.gx-lbl{display:flex;flex-direction:column;gap:1px;min-width:0}
.gx-lbl b{font-size:14px}
.gx-lbl span{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){
  .mx{padding:12px 12px 8px}
  .mx-wrap{margin:0 -12px}
  .mx-strip{padding:2px 12px 6px}
  .mx-tit{width:100%;justify-content:space-between}
  .mx-tit>div{flex:1;text-align:center}
  .mx-tit h2{justify-content:center;font-size:20px}
  .mx-ctrl{width:100%;justify-content:center}
  .mx-ctrl .seg{justify-content:center;flex-wrap:nowrap}
  .mx .seg-b .lg{display:none}.mx .seg-b .sm{display:inline}
  .mx .seg-b{padding:6px 10px}
  .gx-lbl{width:100%}
}

.pg-h{margin-bottom:0}
.pg-body{margin-top:14px}
.pg-tog{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit}
.pg-tog-ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.pg-tog-t{min-width:0;flex:1}

.pg-badge{flex:none;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--cta);color:var(--cta-ink)}

.pg-chev{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);position:relative}

.pg-tog[aria-expanded="true"] .pg-chev::after{transform:rotate(-135deg);top:12px}
.pg-tog:hover .pg-chev{background:var(--accent-soft)}
.pg-tog:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:12px}
@media (max-width:640px){ .pg-h-r .btn{width:100%;justify-content:center} .pg-tog-ico{display:none} }

/* Recebimentos fixos */
.rd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;max-width:520px}
.rd-chip{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;font:inherit;color:var(--hero-ink);background:color-mix(in srgb,var(--hero-ink) 10%,transparent);border:1px solid color-mix(in srgb,var(--hero-ink) 18%,transparent);border-radius:12px;padding:9px 11px}
.rd-t{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hero-ink2)}
.rd-t b{font-weight:700;color:var(--hero-ink2);line-height:1.2}
.rd-t svg{flex:none}
.rd-ed{margin-left:auto;color:var(--hero-ink2);padding:2px}
.rd-ed:hover{color:var(--hero-ink);background:color-mix(in srgb,var(--hero-ink) 15%,transparent)}
.rd-v{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.rd-q{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--hero-ink2)}
.rd-p{font-size:11px;color:var(--hero-ink2);opacity:.8}
.rd-chip.ok .rd-q{color:var(--hero-ink);font-weight:700}
.rd-sw{display:inline-flex;align-items:center;gap:7px;margin-top:6px;padding:4px 9px 4px 4px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 25%,transparent);background:transparent;color:inherit;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;align-self:flex-start}
.rd-sw i{width:26px;height:15px;border-radius:999px;background:color-mix(in srgb,currentColor 25%,transparent);position:relative;flex:none;transition:background .2s}
.rd-sw i::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.rd-sw.on i{background:#1f9d6b} .rd-sw.on i::after{transform:translateX(11px)}
.rd-sw:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.e-mseg{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.rd-chip.hoje .rd-q{color:var(--hero-ink);font-weight:800}
.rd-chip.atr .rd-q{color:#ffd28a;font-weight:700}
.rd-btn{align-self:flex-start;margin-top:4px;border:0;border-radius:999px;padding:4px 10px;font-weight:700;font-size:11.5px;cursor:pointer;background:var(--hero-ink);color:var(--hero-bink,#1d232b)}
.rd-vazio{flex-direction:row;align-items:center;justify-content:center;gap:6px;border-style:dashed;cursor:pointer;font-weight:700;font-size:12.5px;min-height:56px;background:transparent}
.rd-vazio:hover{background:color-mix(in srgb,var(--hero-ink) 10%,transparent)}
.rd-form{grid-column:1/-1;gap:8px;background:var(--surface);color:var(--ink);border-color:var(--line)}
.rd-form .rd-t,.rd-form .rd-t b{color:var(--ink)}
.rd-form .inp{padding:7px 9px}
.fx-prev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.fx-prev>div{background:var(--surface-2);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fx-prev b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.fx-prev small{font-size:12px;color:var(--muted)}
.fx-prev-l b{color:var(--pos)}
.fx-prev.ok .fx-prev-r{background:var(--pos-soft)} .fx-prev.ok .fx-prev-r b{color:var(--pos)}
.fx-prev.bad .fx-prev-r{background:var(--neg-soft)} .fx-prev.bad .fx-prev-r b{color:var(--neg)}
@media (max-width:640px){ .fx-prev{grid-template-columns:1fr} .rd{max-width:none} }

.ct-tile:not(.edit) .ct-v{color:var(--rd-ink)}
.ct-tile:not(.edit) .ct-v.neg{color:var(--neg)}
.ct-tile:not(.edit) .ct-meta{color:var(--rd-sub)}
.ct-tile:not(.edit) .velho{color:var(--neg)}
.ct-tile:not(.edit) .ct-x{color:var(--rd-sub)}

.rd-chip.t-rd_va{--c:#e8a33a}
.rd-chip:not(.rd-form) .rd-t{color:var(--rd-sub)}
.rd-chip:not(.rd-form) .rd-t b{color:var(--rd-ink)}
.rd-chip:not(.rd-form) .rd-t>svg{width:26px;height:26px;padding:5px;border-radius:8px;background:var(--c);color:#fff;box-sizing:border-box}

.rd-chip .rd-ed{color:var(--rd-sub)}

.rd-vazio{border-style:solid}
.rd-vazio>svg{width:26px;height:26px;padding:5px;border-radius:8px;background:var(--c);color:#fff;box-sizing:border-box;flex:none}
.rd-vazio:hover{filter:brightness(.96)}

/* Patrimônio total: investido + em conta */
.pt-split{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.pt-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--hero-ink) 14%,transparent);gap:2px}
.pt-bar span{display:block;height:100%}
.pt-bar .inv{background:var(--hero-ink)}
.pt-bar .cc{background:color-mix(in srgb,var(--hero-ink) 45%,transparent)}
.pt-leg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt-i{display:flex;flex-direction:column;gap:1px;min-width:0;text-align:left;font:inherit;color:var(--hero-ink);background:color-mix(in srgb,var(--hero-ink) 10%,transparent);border:1px solid color-mix(in srgb,var(--hero-ink) 16%,transparent);border-radius:12px;padding:9px 11px}
.pt-l{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--hero-ink2);font-weight:600}
.pt-l i{width:9px;height:9px;border-radius:3px;display:inline-block}
.pt-l i.inv{background:var(--hero-ink)} .pt-l i.cc{background:color-mix(in srgb,var(--hero-ink) 45%,transparent)}
.pt-i b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt-i small{font-size:11.5px;color:var(--hero-ink2)}
.pt-cc{cursor:pointer}
.pt-tot small{display:flex;align-items:center;gap:6px}
.pt-tot small i{width:9px;height:9px;border-radius:3px;display:inline-block;background:var(--hero-ink)}
.pt-cc:hover{background:color-mix(in srgb,var(--hero-ink) 18%,transparent)}
.pt-add{margin-top:12px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px dashed color-mix(in srgb,var(--hero-ink) 45%,transparent);background:transparent;color:var(--hero-ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer}
.pt-add:hover{background:color-mix(in srgb,var(--hero-ink) 12%,transparent)}
/* Barra de navegação inferior (celular) */
.bnav{display:none}
@media (max-width:760px){
  nav.tabs{display:none}
  .top-in{flex-wrap:nowrap;gap:10px;padding:10px 14px}
  .brand small{display:none}
  .brand b{font-size:17px}
  .sync span{display:none}
  .sync{padding:6px}
  main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:6px 4px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .bnav button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;border-radius:14px;position:relative;min-width:0;-webkit-tap-highlight-color:transparent}
  .bnav button span{white-space:nowrap}
  .bnav button[aria-selected="true"]{color:var(--accent)}
  .bnav button[aria-selected="true"]:not(.bnav-main)::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .bnav button:active{transform:scale(.95)}
  .bnav-fab{width:52px;height:52px;margin-top:-26px;border-radius:18px;display:grid;place-items:center;background:var(--cta);color:var(--cta-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--cta) 45%,transparent),0 0 0 4px var(--bg)}
  .bnav-main[aria-selected="true"] .bnav-fab{box-shadow:0 8px 20px color-mix(in srgb,var(--cta) 55%,transparent),0 0 0 4px var(--bg),0 0 0 6px var(--cta)}
  .bnav-main[aria-selected="true"]{color:var(--ink)}
}
@media (max-width:420px){ .pt-leg{grid-template-columns:1fr 1fr} .pt-i b{font-size:15.5px} }

/* Resumo de fim de mês */
.rsm{display:flex;flex-direction:column;gap:14px}
.rs-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rs-lead{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink-2);max-width:72ch}
.rs-lead b{color:var(--ink)}
.rs-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rs-k{background:var(--surface-2);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;min-width:0;border-top:3px solid var(--line)}
.rs-k b{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rs-k.in{border-top-color:var(--pos)} .rs-k.out{border-top-color:var(--cta)}
.rs-k.ok{border-top-color:var(--pos)} .rs-k.ok b{color:var(--pos)}
.rs-k.bad{border-top-color:var(--neg)} .rs-k.bad b{color:var(--neg)}
.rs-l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rs-d{font-size:12px;font-weight:700}
.rs-d.good{color:var(--pos)} .rs-d.bad{color:var(--neg)} .rs-d.neu{color:var(--muted);font-weight:500}
.rs-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
.rs-box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.rs-box h3{margin:0 0 10px;font-size:14px}
.rs-h3b{margin-top:16px!important}
.rs-cats{display:flex;flex-direction:column;gap:10px}
.rs-cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.rs-cn{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-cn i{width:9px;height:9px;border-radius:3px;flex:none}
.rs-cat b{font-size:13.5px}
.rs-cb{grid-column:1/-1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rs-cb i{display:block;height:100%;border-radius:99px}
.rs-cat small{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.rs-top5{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rs-top5 li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rs-top5 li:last-child{border-bottom:0}
.rs-n{width:24px;height:24px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--ink-2)}
.rs-top5 li:first-child .rs-n{background:var(--cta);color:var(--cta-ink)}
.rs-gd{display:flex;flex-direction:column;min-width:0}
.rs-gd b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-gd small{font-size:11.5px;color:var(--muted)}
.rs-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rs-mini>div,.rs-inv>div{background:var(--surface-2);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:1px;min-width:0}
.rs-mini b,.rs-inv b{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rs-mini small{font-size:11.5px;color:var(--muted)}
.rs-inv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rs-inv-p{margin:8px 0 0}
.rs-dest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.rs-dest li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.rs-dest li b{color:var(--ink)}
.rs-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.rs-dest li.good .rs-dot{background:var(--pos)} .rs-dest li.bad .rs-dot{background:var(--neg)}
.rs-pg{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.rs-pgbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rs-pgbar i{display:block;height:100%;background:var(--pos);border-radius:99px}
.rs-foot{display:flex;justify-content:flex-end}
.rs-link{border-color:var(--accent);color:var(--accent)}
@media (max-width:860px){ .rs-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .rs-grid{grid-template-columns:1fr} }
@media (max-width:640px){ .rsm .mx-tit{width:100%} .rs-top .btns{width:100%;justify-content:center} .rs-k b{font-size:18px;white-space:normal} .rs-lead{font-size:14.5px} .rs-foot .btn{width:100%;justify-content:center} }

/* Dinheiro em conta: layout organizado em colunas */
.ct-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:16px 22px;align-items:start}
.ct-hero.so{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr)}
.ct-hero>.ct-head{grid-column:1/-1;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--hero-ink) 18%,transparent)}
.ct-main{align-self:center}
.ct-main .ct-total{margin-top:0}
.ct-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.ct-sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-ink2)}
.ct-col .ct-tiles{grid-template-columns:1fr;gap:8px}
.ct-col-rd .rd{grid-template-columns:1fr;margin-top:0;max-width:none}
.ct-vazio{border:1px dashed color-mix(in srgb,var(--hero-ink) 40%,transparent);background:transparent;color:var(--hero-ink);border-radius:12px;padding:16px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left}
.ct-vazio:hover{background:color-mix(in srgb,var(--hero-ink) 10%,transparent)}
@media (max-width:1100px){ .ct-hero,.ct-hero.so{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .ct-main{grid-column:1/-1} }
@media (max-width:640px){ .ct-hero,.ct-hero.so{grid-template-columns:1fr} .ct-col-rd .rd{grid-template-columns:repeat(2,minmax(0,1fr))} .ct-col-rd{order:2} .ct-col-contas{order:3} }

.lb-imp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid color-mix(in srgb,var(--cta) 55%,var(--line));border-left:5px solid var(--cta);border-radius:var(--r);padding:12px 16px}
.lb-ico{width:40px;height:40px;border-radius:12px;background:var(--cta);color:var(--cta-ink);display:grid;place-items:center;flex:none}
.lb-t{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lb-t b{font-size:14.5px}
.lb-t span{font-size:12.5px;color:var(--ink-2)}
.lb-a{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){ .lb-a{width:100%} .lb-a .btn{flex:1;justify-content:center} }

.ct-aj{font-size:11px;color:var(--rd-sub,var(--hero-ink2));line-height:1.3}

/* ===== Tema Portal Azul: azul royal, cinza-pérola e amarelo ===== */
:root[data-tema="portal"] body{background:radial-gradient(1200px 600px at 70% -10%,#F4F4F2 0%,transparent 60%),#E8E8E5}
:root[data-tema="portal"] .top{border-bottom:3px solid #3FA6E8}
:root[data-tema="portal"] .brand b{color:#fff}
:root[data-tema="portal"] .mark{background:#FFD83D;box-shadow:0 4px 12px -6px rgba(0,0,0,.45)}
:root[data-tema="portal"] .mark svg{stroke:#174A82}
:root[data-tema="portal"] nav.tabs button[aria-selected="true"]{background:#FFD83D;color:#174A82;outline:1px dashed rgba(23,74,130,.45);outline-offset:-4px}
:root[data-tema="portal"] .card,:root[data-tema="portal"] .mx,:root[data-tema="portal"] .gx-bar{background:linear-gradient(180deg,#FFFFFF 0%,#F4F4F1 100%);border:1px solid #C9C8C2;border-radius:14px;box-shadow:0 0 0 4px #DEDDD8,0 3px 10px -4px rgba(0,0,0,.12)}
:root[data-tema="portal"] .hero-main,:root[data-tema="portal"] .ct-hero{background:linear-gradient(180deg,#3189D3 0%,#2271BE 45%,#1B5FA8 100%);border:1px solid #17508F;border-radius:14px;box-shadow:0 0 0 4px #D9D8D3,0 10px 24px -14px rgba(27,95,168,.8)}
:root[data-tema="portal"] .hero-main .eyebrow,:root[data-tema="portal"] .ct-hero .eyebrow,:root[data-tema="portal"] .ct-sub{color:#FFD83D;text-shadow:0 1px 0 rgba(0,0,0,.18)}
:root[data-tema="portal"] .card-h h2,:root[data-tema="portal"] .mx-tit h2{color:#1B4F8C}
:root[data-tema="portal"] .btn{background:linear-gradient(180deg,#FCFBF8 0%,#E3E1D9 100%);border-color:#CAC8BF;color:#4F4E48;box-shadow:inset 0 1px 0 #fff}
:root[data-tema="portal"] .btn:hover{filter:brightness(1.03)}
:root[data-tema="portal"] .btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
:root[data-tema="portal"] .btn.primary,:root[data-tema="portal"] .seg-b[aria-pressed="true"]{background:linear-gradient(180deg,#43A0E8 0%,#2272C0 55%,#1B5FA8 100%);border-color:#17508F;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px -3px rgba(27,95,168,.8)}
:root[data-tema="portal"] .hero-main .btn.primary{background:linear-gradient(180deg,#FFE36B,#FFD83D);border-color:#E0B800;color:#174A82;text-shadow:none}
:root[data-tema="portal"] .inp{background:linear-gradient(180deg,#ECECE9 0%,#FFFFFF 70%);border-color:#D3D2CC;box-shadow:inset 0 2px 3px rgba(0,0,0,.07);border-radius:10px}
:root[data-tema="portal"] .mx-c.on{background:linear-gradient(180deg,#43A0E8,#1B5FA8);border-color:#17508F;outline:1px dashed rgba(255,255,255,.55);outline-offset:-4px}
:root[data-tema="portal"] .mx-c.on .mx-m,:root[data-tema="portal"] .mx-c.on .mx-v,:root[data-tema="portal"] .mx-c.on .mx-y{color:#fff}
:root[data-tema="portal"] .ct-tile:not(.edit),:root[data-tema="portal"] .rd-chip:not(.rd-form){box-shadow:0 0 0 3px rgba(255,255,255,.25),0 8px 22px rgba(0,0,0,.18)}
:root[data-tema="portal"] .ct-tile:not(.edit) .ct-up{background:linear-gradient(180deg,#43A0E8,#1B5FA8);color:#fff}
:root[data-tema="portal"] .ct-add-b{border-color:#FFD83D;color:#FFD83D}
:root[data-tema="portal"] .toast{background:#1B5FA8;color:#fff;border-left:4px solid #FFD83D}
:root[data-tema="portal"] .bnav{background:linear-gradient(180deg,#2C80C9 0%,#195596 100%);border-color:#17508F}
:root[data-tema="portal"] .bnav button{color:rgba(255,255,255,.78)}
:root[data-tema="portal"] .bnav button[aria-selected="true"]{color:#FFD83D}
:root[data-tema="portal"] .bnav button[aria-selected="true"]:not(.bnav-main)::before{background:#FFD83D}
:root[data-tema="portal"] .bnav-fab{background:linear-gradient(180deg,#FFE36B,#FFD83D);color:#174A82}
:root[data-tema="portal"] .theme-btn{background:linear-gradient(180deg,#FCFBF8,#E1DFD7);border-color:#174E8C;color:#4F4E48}
:root[data-tema="portal"] .pg-tog-ico,:root[data-tema="portal"] .lb-ico{background:linear-gradient(180deg,#43A0E8,#1B5FA8);color:#fff}

/* Autocompletar */
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px -12px rgba(0,0,0,.35);padding:4px;max-height:320px;overflow:auto}
.ac-it{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;font:inherit;color:var(--ink)}
.ac-it:hover,.ac-it.on{background:var(--accent-soft)}
.ac-d{display:flex;flex-direction:column;min-width:0}
.ac-d b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-d b mark{background:transparent;color:var(--accent);font-weight:800}
.ac-d small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-d small i{width:8px;height:8px;border-radius:2px;flex:none}
.ac-v{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ac-v small{font-weight:500;font-size:11px;color:var(--muted)}

/* Busca */
.bs-ov{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:6vh 16px 16px}
.bs-ov[hidden]{display:none}
body.bs-on{overflow:hidden}
.bs-pn{width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);overflow:hidden}
.bs-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bs-ico{color:var(--accent);display:grid;place-items:center}
.bs-q{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:6px 2px;outline:none}
.bs-q::-webkit-search-cancel-button{display:none}
.bs-fil{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.bs-cat{width:auto;padding:6px 9px;font-size:12.5px}
.bs-res{overflow:auto;padding:12px 14px 16px;flex:1}
.bs-vazio{padding:26px 8px;text-align:center;color:var(--ink-2)}
.bs-vazio b{font-size:15px;color:var(--ink)}
.bs-vazio p{margin:6px 0 14px;font-size:13px;color:var(--muted)}
.bs-sugs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:12px;color:var(--muted)}
.bs-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.bs-sum>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.bs-sum b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.bs-sum b.bs-p{font-size:14px}
.bs-sum small{font-size:11.5px;color:var(--muted)}
.bs-mes{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 4px 4px;border-bottom:1px solid var(--line)}
.bs-it{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:9px 4px;font:inherit;color:var(--ink);cursor:pointer}
.bs-it:hover{background:var(--accent-soft)}
.bs-dt{display:flex;flex-direction:column;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.bs-dt small{font-weight:500;font-size:10.5px;color:var(--muted)}
.bs-d{display:flex;flex-direction:column;min-width:0}
.bs-d b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-d b mark{background:transparent;color:var(--accent);font-weight:800}
.bs-d small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-d small i{width:8px;height:8px;border-radius:2px;flex:none}
.bs-v{font-weight:700;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bs-mais{width:100%;justify-content:center;margin-top:12px}
@media (max-width:640px){ .bs-ov{padding:0} .bs-pn{max-height:none;height:100%;border-radius:0;width:100%} .bs-fil{flex-wrap:nowrap;overflow-x:auto} .bs-fil .seg{flex-wrap:nowrap;flex:none} .bs-fil .bs-cat{flex:none} }

@media (max-width:760px){
  .top{transition:transform .28s ease}
  .bnav{transition:transform .28s ease,opacity .28s ease}
  body.nav-off .top{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 4px))}
  body.nav-off .bnav{transform:translateY(calc(100% + 24px + env(safe-area-inset-bottom,0px)));opacity:0;pointer-events:none}
  body.nav-off .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){ .top,.bnav{transition:none} }

/* ===== Vidro líquido ===== */
:root[data-glass]{background:var(--gl-g0)}
:root[data-glass] body{background:transparent;position:relative}
:root[data-glass] body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 34% at 14% 18%,var(--gl-g1),transparent 70%),radial-gradient(34% 30% at 88% 12%,var(--gl-g2),transparent 70%),
  radial-gradient(44% 40% at 72% 88%,var(--gl-g3),transparent 70%),radial-gradient(30% 28% at 22% 86%,var(--gl-g2),transparent 72%),var(--gl-g0);
  filter:blur(50px) saturate(135%);animation:glDrift 38s ease-in-out infinite alternate}
:root[data-glass="dark"] body::before{opacity:.85}
:root[data-glass="light"] body::before{opacity:.95}
@keyframes glDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-3%,2%,0) scale(1.06)}100%{transform:translate3d(2%,-2%,0) scale(1.02)}}
:root[data-glass] .card,:root[data-glass] .perf,:root[data-glass] .kpi,:root[data-glass] .mx,:root[data-glass] .gx-bar,:root[data-glass] .lb-imp,:root[data-glass] .theme-pop,:root[data-glass] .bs-pn,:root[data-glass] .ac-list,:root[data-glass] .bnav,:root[data-glass] .top{
  background:var(--gl-glass);border:1px solid var(--gl-bd);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--gl-hi),inset 0 -1px 0 rgba(255,255,255,.04),0 18px 40px -22px var(--gl-sh)}
:root[data-glass] .card,:root[data-glass] .perf,:root[data-glass] .mx,:root[data-glass] .gx-bar{border-radius:22px}
:root[data-glass] .top{border-width:0 0 1px;border-radius:0}
:root[data-glass] .theme-pop,:root[data-glass] .bs-pn,:root[data-glass] .ac-list{background:var(--gl-glass2)}
:root[data-glass="dark"] .theme-pop,:root[data-glass="dark"] .bs-pn,:root[data-glass="dark"] .ac-list{background:color-mix(in srgb,var(--gl-g0) 72%,transparent)}
:root[data-glass] .hero-main,:root[data-glass] .ct-hero{background:var(--hero);border:1px solid var(--gl-bd);border-radius:24px;-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.06),0 24px 50px -24px var(--gl-sh);position:relative;overflow:hidden}
:root[data-glass] .hero-main::after,:root[data-glass] .ct-hero::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08) 100%)}
:root[data-glass] .ct-hero>*{position:relative;z-index:1}
:root[data-glass] .ct-hero{--rd-ink:var(--hero-ink);--rd-sub:var(--hero-ink2)}
:root[data-glass] .ct-tile:not(.edit),:root[data-glass] .rd-chip:not(.rd-form),:root[data-glass] .pt-i{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);border-top-width:1px;color:var(--hero-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-glass] .ct-tile:not(.edit) .ct-up,:root[data-glass] .rd-chip .rd-btn{background:rgba(255,255,255,.92);color:#16203A}
:root[data-glass] .ct-tile:not(.edit) .velho,:root[data-glass] .rd-chip.atr .rd-q{color:#FFE08A}
:root[data-glass] .rd-chip.ok .rd-q{color:#C6FFE4}
:root[data-glass] .ct-tile:not(.edit) .ct-v.neg{color:#FFD0D0}
:root[data-glass] .inp{background:var(--input);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
:root[data-glass] .btn{border-radius:12px}
:root[data-glass] .btn:not(.primary):not(.ghost){background:var(--surface-2);border-color:var(--gl-bd);box-shadow:inset 0 1px 0 var(--gl-hi)}
:root[data-glass] .btn.primary,:root[data-glass] .seg-b[aria-pressed="true"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -10px var(--cta)}
:root[data-glass] .seg,:root[data-glass] .mes-nav,:root[data-glass] nav.tabs{background:var(--surface-2);border:1px solid var(--gl-bd)}
:root[data-glass] nav.tabs button[aria-selected="true"]{box-shadow:0 6px 16px -8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
:root[data-glass] .mx-c.on{box-shadow:0 10px 24px -10px var(--cta),inset 0 1px 0 rgba(255,255,255,.35)}
:root[data-glass] .bnav{border-radius:24px;background:var(--gl-glass2)}
:root[data-glass="dark"] .bnav{background:color-mix(in srgb,var(--gl-g0) 55%,transparent)}
:root[data-glass] .bnav-fab{box-shadow:0 10px 24px -8px var(--cta),0 0 0 4px rgba(255,255,255,.18)}
:root[data-glass] .mark{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px -8px var(--cta)}
:root[data-glass] .toast{background:var(--gl-glass2);color:var(--ink);border:1px solid var(--gl-bd);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:0 18px 40px -18px var(--gl-sh)}
:root[data-glass="dark"] .toast{background:color-mix(in srgb,var(--gl-g0) 70%,transparent)}
:root[data-glass] .pg-k,:root[data-glass] .rs-k,:root[data-glass] .pg-row .pg-dt,:root[data-glass] .bs-sum>div,:root[data-glass] .fx-prev>div{box-shadow:inset 0 1px 0 var(--gl-hi)}
:root[data-glass] .rs-box,:root[data-glass] .pg-form,:root[data-glass] .pg-sugs{background:var(--surface-2);border-color:var(--gl-bd)}
.pv-gl{position:relative}
.pv-gl>span,.pv-gl .r span{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@media (prefers-reduced-motion:reduce){ :root[data-glass] body::before{animation:none} }
@media (max-width:760px){ :root[data-glass] body::before{animation:none;filter:blur(40px)} }

.ct-ajb{display:flex;gap:6px;margin-top:6px}
.ct-q{flex:1;border:1px solid color-mix(in srgb,var(--rd-ink,#1d232b) 18%,transparent);background:color-mix(in srgb,var(--rd-ink,#1d232b) 6%,transparent);color:var(--rd-ink,#1d232b);border-radius:9px;padding:6px 8px;font:inherit;font-weight:800;font-size:12px;cursor:pointer}
.ct-q.out:hover{background:var(--neg-soft);color:var(--neg);border-color:var(--neg)}
.ct-q.in:hover{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.ct-aj-f{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ct-aj-f .inp{padding:7px 9px;background:var(--surface);color:var(--ink);border-color:var(--line)}
.ct-aj-seg{align-self:flex-start}
.ct-aj-f .seg-r span{color:var(--rd-sub,var(--ink-2))}

/* Empréstimos */
.em-ico{background:color-mix(in srgb,#6d8fd6 22%,transparent);color:#6d8fd6}
.em-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.em-card{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);min-width:0}
.em-card.quit{opacity:.75}
.em-top{display:flex;align-items:center;gap:10px}
.em-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;background:#6d8fd6;color:#fff;flex:none}
.em-n{flex:1;min-width:0;display:flex;flex-direction:column}
.em-n b{font-size:15px}
.em-n small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.em-nums>div:first-child{grid-column:1/-1}
.em-nums>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.em-nums b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.em-nums>div:first-child b{font-size:24px}
.em-nums small{font-size:11.5px;color:var(--muted)}
.em-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.em-bar i{display:block;height:100%;background:var(--pos);border-radius:99px}
.em-ag{display:flex;flex-direction:column;gap:6px}
.em-chs{display:flex;gap:5px;flex-wrap:wrap}
.em-ch{display:flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:40px;border-radius:9px;background:var(--surface);border:1px solid var(--line);line-height:1.05}
.em-ch b{font-size:11.5px;text-transform:capitalize}
.em-ch small{font-size:9.5px;color:var(--muted)}
.em-ch.st-pago{background:var(--pos-soft);border-color:transparent;color:var(--pos)}
.em-ch.st-pago small{color:var(--pos)}
.em-ch.st-parcial{background:linear-gradient(180deg,var(--surface) 50%,var(--pos-soft) 50%)}
.em-ch.st-atrasada{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.em-ch.st-mes{border-color:var(--cta);box-shadow:0 0 0 1px var(--cta)}
.em-alerta{margin:0;font-size:12.5px;font-weight:700;color:var(--neg)}
.em-acts{display:flex;gap:8px}
.em-pay{margin-top:0}
.em-hist summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.em-hr{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.em-hr:last-child{border-bottom:0}
.em-prev{margin:0;font-weight:600;color:var(--accent)}
@media (max-width:640px){ .em-lista{grid-template-columns:1fr} }

/* Projeção */
.pj-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:18px;align-items:start}
.pj-in{display:flex;flex-direction:column;gap:16px;background:var(--surface-2);border-radius:16px;padding:16px}
.pj-f{display:flex;flex-direction:column;gap:7px;min-width:0}
.pj-lb{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pj-atual{font-family:var(--f-display);font-size:22px}
.pj-chips{display:flex;flex-wrap:wrap;gap:6px}
.pj-chips .chip.on{border-color:var(--accent);color:var(--accent)}
.pj-sub{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pj-mini{width:64px!important;padding:5px 8px!important;text-align:center}
.pj-taxas .seg-b small{font-weight:600;opacity:.8}
.pj-anos{display:flex;align-items:center;gap:12px}
.pj-anos input{flex:1;accent-color:var(--cta)}
.pj-anos b{min-width:70px;text-align:right;font-family:var(--f-display);font-size:17px}
.pj-out{display:flex;flex-direction:column;gap:14px;min-width:0}
.pj-hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.pj-ht{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-ink2)}
.pj-big{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,44px);letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.pj-hs{font-size:13px;color:var(--hero-ink2)}
.pj-split{display:flex;flex-direction:column;gap:10px}
.pj-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--line)}
.pj-bar i{display:block;height:100%}
.pj-bar i.inv,.pj-leg i.inv{background:var(--cta)}
.pj-bar i.jr,.pj-leg i.jr{background:var(--pos)}
.pj-leg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pj-leg>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pj-leg span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.pj-leg i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.pj-leg b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pj-leg small{font-size:11px;color:var(--muted)}
.pj-ch{height:260px;position:relative}
.pj-box{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pj-box h3{margin:0 0 10px;font-size:14px}
.pj-tab summary{cursor:pointer;list-style:none}
.pj-tab summary h3{display:inline;margin:0}
.pj-tab[open] summary{margin-bottom:10px}
.pj-marcos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pj-m{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--pos)}
.pj-m b{font-family:var(--f-display);font-size:16px}
.pj-m span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pj-m small{font-size:11px;color:var(--muted)}
.pj-cen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pj-cen>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
.pj-cen>div.on{border-color:var(--accent)}
.pj-cen span{font-size:11.5px;color:var(--muted)}
.pj-cen b{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.pj-nota{margin:0;font-size:11.5px}
.pj-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:1px solid color-mix(in srgb,var(--hero-ink) 35%,transparent);background:color-mix(in srgb,var(--hero-ink) 10%,transparent);color:var(--hero-ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.pj-link:hover{background:color-mix(in srgb,var(--hero-ink) 20%,transparent)}
@media (max-width:980px){ .pj-grid{grid-template-columns:1fr} }
@media (max-width:640px){ .pj-leg,.pj-cen{grid-template-columns:1fr 1fr} .pj-leg>div:last-child{grid-column:1/-1} .pj-cen>div:last-child{grid-column:1/-1} .pj-ch{height:220px} .pj-in .seg{flex-wrap:wrap} }

/* Lançar: saldo x aporte bem diferenciados */
.lc-leg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.lc-k{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;border:1px solid var(--line)}
.lc-k b{display:block;font-size:13.5px}
.lc-k span:not(.lc-i){font-size:12.5px;color:var(--ink-2);line-height:1.45}
.lc-k strong{color:var(--ink)}
.lc-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.lc-k.saldo{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.lc-k.saldo .lc-i{background:var(--accent);color:var(--accent-ink)}
.lc-k.saldo b{color:var(--accent)}
.lc-k.ap{background:color-mix(in srgb,var(--cta) 10%,var(--surface));border-color:color-mix(in srgb,var(--cta) 45%,var(--line))}
.lc-k.ap .lc-i{background:var(--cta);color:var(--cta-ink)}
.lc-k.ap b{color:var(--cta)}
.lc-eq{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:2px 2px 0}
.lc-eq span{background:var(--surface-2);border-radius:7px;padding:3px 8px;font-weight:600}
.lc-eq span:first-child{background:var(--pos-soft);color:var(--pos)}
.lc-eq span.s{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.lc-eq span.a{background:color-mix(in srgb,var(--cta) 15%,transparent);color:var(--cta)}
.lc-eq b{color:var(--muted)}
.entry .h-saldo{text-align:right;color:var(--accent)!important}
.entry .h-ap{text-align:right;color:var(--cta)!important}
.in-saldo{border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--line))!important;font-weight:700;font-size:15px}
.in-saldo:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.in-ap{border:1.5px dashed color-mix(in srgb,var(--cta) 60%,var(--line))!important;background:color-mix(in srgb,var(--cta) 5%,var(--surface))!important}
.in-ap:focus{border-style:solid!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--cta) 25%,transparent)}
.in-ap::placeholder{font-size:12px;opacity:.8}
.in-ap:disabled{opacity:.45;border-style:dotted!important}
.f-saldo .lbl{color:var(--accent)!important;font-weight:700}
.f-ap .lbl{color:var(--cta)!important;font-weight:700}
.dl{display:inline-flex;flex-direction:column;align-items:flex-end;gap:4px}
.dl-r,.dl-a{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.dl small{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dl-r{flex-wrap:wrap;justify-content:flex-end}
.dl-r em{font-style:normal;font-weight:500;font-size:11.5px;opacity:.85;flex-basis:100%;text-align:right}
@media (max-width:760px){ .dl-r{justify-content:flex-start} .dl-r em{flex-basis:auto;text-align:left} }
.dl-a{background:color-mix(in srgb,var(--cta) 14%,transparent);color:var(--cta);border-radius:999px;padding:2px 8px;font-size:12px}
.dl-a small{color:inherit}
.dl-a.res{background:var(--neg-soft);color:var(--neg)}
.dl-ini{display:inline-flex;flex-direction:column;align-items:flex-end;color:var(--ink-2);font-size:12.5px}
.dl-ini small{font-weight:500;color:var(--muted);font-size:11px}
@media (max-width:760px){ .lc-leg{grid-template-columns:1fr} .dl,.dl-ini{align-items:flex-start} .dl{flex-direction:row;flex-wrap:wrap} }

/* Menu da aba Gastos */
.gnav{position:sticky;top:calc(var(--top-h,64px) + 8px);z-index:15;display:flex;align-items:center;gap:8px;padding:6px;border-radius:16px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 26px -18px rgba(0,0,0,.45);transition:top .28s ease}
body.nav-off .gnav{top:8px}
.gnav-menu{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:8px 12px;background:var(--cta);color:var(--cta-ink);font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.gnav-sc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.gnav-sc::-webkit-scrollbar{display:none}
.gnav-c{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink-2);border-radius:10px;padding:7px 11px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.gnav-c:hover{background:var(--surface-2);color:var(--ink)}
.gnav-c.on{background:var(--accent-soft);color:var(--accent)}
.gn-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gn-h b{font-family:var(--f-display);font-size:16px}
.gn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gn-t{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 12px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.gn-t:hover{border-color:var(--accent);transform:translateY(-1px)}
.gn-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.gn-t.c-cta .gn-ic{background:var(--cta);color:var(--cta-ink)}
.gn-t.c-pos .gn-ic{background:var(--pos-soft);color:var(--pos)}
.gn-tx{display:flex;flex-direction:column;min-width:0}
.gn-tx b{font-size:13.5px}
.gn-tx small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn-sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.gn-ir{display:flex;flex-wrap:wrap;gap:6px}
.gn-l{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.gn-l:hover{border-color:var(--accent);color:var(--accent)}
:root[data-glass] .gnav{background:var(--gl-glass2);border-color:var(--gl-bd)}

.gi-tg-t b i{font-style:normal;font-size:11px;font-weight:800;background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:1px 7px}
.gi-tg-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi-tg>svg{color:var(--muted)}
.gi-hist-card{padding:14px 16px}

.gi-dono-cf{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gi-dono-cf>b{font-size:15px} .gi-dono-cf p{margin:0;font-size:12.5px;color:var(--ink-2)}
.gi-dc-l{display:flex;flex-direction:column;gap:6px}
.gi-dc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer}
.gi-dc b{font-size:14px} .gi-dc small{font-size:11.5px;color:var(--muted)}
.gi-dc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.gi-dc-im{font-weight:600}
.gi-dono-cf .btn{align-self:flex-start}

/* ===== Caixinha ===== */
.cx-sheet{max-width:560px}
.cx-drop{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:18px 12px;font:inherit;cursor:pointer;margin-top:8px}
.cx-drop svg{color:var(--accent)} .cx-drop b{font-size:14.5px} .cx-drop small{font-size:12px;color:var(--muted);text-align:center}
.cx-drop:disabled{opacity:.6;cursor:wait}
.cx-err{color:var(--neg);font-size:13px;margin:10px 0 0}
.cx-l{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cx-it{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.cx-row{display:grid;grid-template-columns:42px minmax(0,1fr);gap:11px;align-items:center}
.cx-ic,.cx-th{width:42px;height:42px;border-radius:11px}
.cx-ic{display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.cx-th{object-fit:cover;background:var(--surface-2)}
.cx-m{min-width:0;display:flex;flex-direction:column;gap:2px} .cx-m b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cx-m small{font-size:12px;color:var(--muted)} .cx-m small.velho{color:var(--neg)}
.cx-a{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;padding-left:53px;font-size:13px}
.cx-pv{display:block;width:100%;max-height:60vh;object-fit:contain;border:0;border-radius:10px;margin-top:10px;background:var(--surface-2);min-height:200px}
.cx-limpar{margin-top:12px}
.cx-vazio{margin-top:14px;text-align:center}
.cx-off{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.cx-off p{margin:0;font-size:13px;color:var(--ink-2)} .cx-off .btn{align-self:flex-start;gap:7px}
.cx-pop{display:flex;align-items:center;gap:12px;width:100%;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.cx-pop>svg:first-child{color:var(--accent);flex:none} .cx-pop span{flex:1;display:flex;flex-direction:column;gap:2px} .cx-pop b{font-size:14px} .cx-pop small{font-size:12px;color:var(--muted)}
@media (max-width:640px){ .cx-a{padding-left:0} }

/* ===== hierarquia: 3 páginas, herói único ===== */
.gp-tl{grid-template-columns:repeat(var(--n,4),1fr)}
.gp-ind,.gp-tabs .gp-ind{width:calc(100% / var(--n,4) - 1.5px)}
.hx-eye{border:0;background:transparent;color:inherit;opacity:.85;cursor:pointer;padding:2px 4px;margin-left:4px;vertical-align:-3px;border-radius:6px}
.hx-eye:hover{opacity:1;background:rgba(255,255,255,.14)}
.hx-conta{display:flex;align-items:center;gap:12px}
.hx-conta .hx-c1,.hx-conta .hx-c2{display:flex;flex-direction:column;gap:1px;text-align:left}
.hx-conta .hx-c1{flex:1 1 auto} .hx-conta .hx-c2{flex:0 0 auto;text-align:right;align-items:flex-end}
.hx-conta small{font-size:11.5px;opacity:.8;font-weight:600} .hx-conta b{font-size:15px;font-variant-numeric:tabular-nums}
.hx-conta span{opacity:1 !important}
.hx+.rz{margin-top:-6px}

/* ===== Google Drive ===== */
.sync.gd{cursor:pointer}
.sync.gd.err i{background:var(--neg)}
.gd-info{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.gd-info p{margin:0;font-size:13.5px;color:var(--ink-2)} .gd-info ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.gd-info .btn{align-self:flex-start;gap:8px}
.gd-st{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.gd-st i{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.gd-st.ok i{background:var(--pos)} .gd-st.erro i{background:var(--neg)} .gd-st.entrar i,.gd-st.pendente i,.gd-st.rodando i{background:#e0a020}
.gd-st span{display:flex;flex-direction:column;gap:2px} .gd-st b{font-size:14.5px} .gd-st small{font-size:12px;color:var(--muted)}
.gd-esc{display:flex;flex-direction:column;gap:8px;margin-top:8px} .gd-esc p{margin:0 0 4px;font-size:13.5px;color:var(--ink-2)}

/* ===== 4 abas ===== */
.bnav button{position:relative}
.bn-b{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--neg);color:#fff;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
