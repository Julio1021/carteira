        <button class="rz-a danger" data-act="ct-del" data-id="${c.id}">${ico('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>')}Remover</button></div>
      ${sc.n?`<p class="rz-nota">${fmt(c.saldo)} em ${dShort(c.data)}${sc.menos?` − ${fmt(sc.menos)} gasto${sc.n>1?"s":""}`:""}${sc.mais?` + ${fmt(sc.mais)} recebido`:""} lançados depois.</p>`:""}`;
    return `<div class="rz-it ${aberto?"open":""}"><button class="rz-row" data-act="ct-abrir" data-id="${c.id}" aria-expanded="${aberto}">
        <span class="rz-av">${esc(ini)}</span>
        <span class="rz-m"><b>${esc(c.nome)}</b><small class="${dd>7?"velho":""}">${dd===0?"Atualizado hoje":dd===1?"Atualizado ontem":`Atualizado há ${dd} dias`}${c.origem==="extrato"?" · pelo extrato":""}</small></span>
        <span class="rz-v ${sc.valor<0?"neg-t":""}">${rzV(sc.valor)}</span>${svgI('<path d="M6 9l6 6 6-6"/>',15)}</button>${det}</div>`; };
  const nova=S.ctNova?`<form class="rz-f" id="f-ct-nova" autocomplete="off"><input class="inp" id="ctn_nova" placeholder="Nome, ex.: Nubank" maxlength="30" required aria-label="Nome da conta"><input class="inp money" id="ctv_nova" inputmode="decimal" placeholder="Saldo atual" required aria-label="Saldo atual"><span class="btns"><button class="btn sm primary" type="submit">Adicionar</button><button class="btn sm" type="button" data-act="ct-cancel">Cancelar</button></span></form>`:"";
  const contas=`<section class="card rz" id="sec-conta" aria-label="Suas contas">
    <div class="rz-h"><h2>Suas contas</h2>${cs.length>1?`<b class="rz-tot">${fmt(saldoTotalContas())}</b>`:""}${S.ctNova?"":`<button class="copy" data-act="ct-nova">+ Adicionar</button>`}</div>
    ${cs.length?`<div class="rz-l">${cs.map(linhaConta).join("")}</div>`:`<p class="hint">Nenhuma conta ainda. Ao importar um extrato, a conta e o saldo entram sozinhos.</p>`}
    ${nova}
  </section>`;
  const linhaRenda=id=>{ const t=RD_TIPOS[id], r=S.rendas.get(id);
    if(S.rdEdit===id){ const rr=r||{regra:t.regra,dia:t.dia};
      return `<form class="rz-f rd-form" data-rd="${id}" autocomplete="off"><b class="rz-ft">${t.nome}</b>
        <input class="inp money" id="rdv_${id}" inputmode="decimal" placeholder="Valor, ex.: 3.500,00" value="${r&&r.valor?numF.format(r.valor):""}" aria-label="Valor">
        <select class="inp" id="rdq_${id}" aria-label="Quando cai"><option value="util" ${rr.regra==="util"?"selected":""}>Último dia útil do mês</option>${Array.from({length:31},(_,k)=>`<option value="${k+1}" ${rr.regra==="dia"&&rr.dia===k+1?"selected":""}>Todo dia ${k+1}</option>`).join("")}</select>
        <span class="btns"><button class="btn sm primary" type="submit">Salvar</button><button class="btn sm" type="button" data-act="rd-no">Cancelar</button>${r?`<button class="btn sm ghost danger" type="button" data-act="rd-del" data-id="${id}">Remover</button>`:""}</span></form>`; }
    if(!r||!r.valor) return `<button class="rz-row rz-add" data-act="rd-edit" data-id="${id}"><span class="rz-av t-${id}">${t.ico}</span><span class="rz-m"><b>Informar ${t.nome.toLowerCase()}</b><small>Para prever quando o dinheiro entra</small></span>${svgI('<path d="M12 5v14M5 12h14"/>',15)}</button>`;
    const st=rdStatus(r,ym); let q, cl="";
    if(st.rec){ q=`Recebido em ${dShort(st.rec.data)}`; cl="ok"; } else if(st.dias>0) q=`Cai em ${dShort(st.data)} · ${st.dias===1?"amanhã":`em ${st.dias} dias`}`; else if(st.dias===0){ q="Cai hoje"; cl="hoje"; } else { q=`Previsto para ${dShort(st.data)} · ainda não chegou`; cl="atr"; }
    return `<div class="rz-it"><div class="rz-row as-div"><span class="rz-av t-${id}">${t.ico}</span>
        <span class="rz-m"><b>${t.nome}</b><small class="${cl}">${st.rec?"✓ ":""}${q}</small></span>
        <span class="rz-v ${st.rec?"pos-t":""}">${rzV(r.valor)}</span><button class="icon-btn rz-ed" data-act="rd-edit" data-id="${id}" aria-label="Editar ${t.nome.toLowerCase()}">${svgI(ICO_ED,15)}</button></div>
      ${!st.rec&&st.dias<=0?`<div class="rz-acts"><button class="rz-a" data-act="rd-recebi" data-id="${id}">${ico('<path d="M5 12l5 5L20 7"/>')}Marcar como recebido</button></div>`:""}
      ${id==="rd_salario"?`<button class="rz-sw" data-act="sal-messeg" role="switch" aria-checked="${!!r.mesSeg}"><span><b>Contar no mês seguinte</b><small>${r.mesSeg?`O salário do fim do mês conta como dinheiro de ${mesNome(ymAdd(st.data.slice(0,7),1))}`:"Desligado: conta no mês em que cai"}</small></span><i aria-hidden="true"></i></button>`:""}</div>`; };
  const rendas=`<section class="card rz" aria-label="A receber">
    <div class="rz-h"><h2>Recebimentos fixos</h2></div>
    <div class="rz-l">${linhaRenda("rd_salario")}${linhaRenda("rd_va")}</div></section>`;
  return {contas,rendas};
}

const RZ={imp:false,ocultar:(()=>{ try{ return localStorage.getItem("diario-ocultar")==="1"; }catch{ return false; } })(),contas:false,ag:false};
const rzV=v=>RZ.ocultar?"R$ ••••••":fmt(v);
function rzPrev(G){
  const E=G.totalE, O=G.total, atual=!!G.ehMesAtual;
  const prev=S.gPer==="mes"&&G.ym>=todayISO().slice(0,7)?rdAReceber(G.ym):[];
  const aRec=prev.reduce((t,x)=>t+x.r.valor,0);
  let abertas=0; try{ abertas=S.gPer==="mes"&&S.pagar.size?pgMesDados(G.ym).falta:0; }catch{}
  const gastoFim=atual?Math.max(G.projecao||O,O+abertas):O+(G.ym>todayISO().slice(0,7)?abertas:0);
  return {E,O,aRec,abertas,gastoFim,entPrev:E+aRec,fecha:E+aRec-gastoFim,atual};
}
function rzAgenda(){
  const hoje=todayISO(), mA=hoje.slice(0,7), it=[];
  [...S.rendas.values()].filter(r=>r.valor>0).forEach(r=>{ [mA,ymAdd(mA,1)].forEach(ym=>{ const st=rdStatus(r,ym), d=st.rec?st.rec.data:rdData(r,ym);
    if(st.rec&&d.slice(0,7)!==mA) return; if(!st.rec&&ym!==mA&&it.some(x=>x.id===r.id&&!x.rec)) return;
    it.push({id:r.id,data:d,nome:(RD_TIPOS[r.id]||{}).nome||"Recebimento",valor:st.rec?st.rec.valor:r.valor,rec:!!st.rec,atr:!st.rec&&d<hoje}); }); });
  [...S.emps.values()].forEach(e=>{ try{ const D=emDados(e); if(D.quitado||!D.prox) return; it.push({id:e.id,data:D.prox.venc,nome:`Parcela · ${e.pessoa||"empréstimo"}`,valor:Math.max(0,D.prox.val-D.prox.cob),rec:false,atr:D.prox.venc<hoje}); }catch{} });
  it.sort((a,b)=>a.data.localeCompare(b.data));
  const rec=it.filter(x=>x.rec).slice(-1), fut=it.filter(x=>!x.rec);
  return [...rec,...fut].slice(0,3);
}
function vRzSaldo(G,P){
  const cs=[...S.contas.values()], tot=cs.length?saldoTotalContas():null;
  const rec=cs.length?cs.reduce((m,c)=>c.data>m?c.data:m,cs[0].data):null, dd=rec?diasDesde(rec):null;
  const at=dd==null?"Nenhuma conta cadastrada":dd===0?"Atualizado hoje":dd===1?"Atualizado ontem":`Atualizado há ${dd} dias`;
  const ok=dd!=null&&dd<=2;
  const proj=tot!=null&&P.atual?tot+P.aRec-Math.max(0,P.gastoFim-P.O):null;
  const olho=RZ.ocultar?'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>':'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  return `<section class="rz-sd" aria-label="Saldo disponível">
    <div class="rz-sd-top"><span class="rz-sd-l">Saldo disponível <button class="rz-eye" data-act="rz-olho" aria-pressed="${RZ.ocultar}" aria-label="${RZ.ocultar?"Mostrar":"Esconder"} valores">${svgI(olho,18)}</button></span>
      <button class="rz-sd-go" data-act="rz-contas" aria-expanded="${RZ.contas}" aria-label="Ver contas">${svgI(RZ.contas?'<path d="M6 15l6-6 6 6"/>':'<path d="M9 6l6 6-6 6"/>',20)}</button></div>
    <b class="rz-sd-v">${tot==null?"R$ —":rzV(tot)}</b>
    <span class="rz-sd-at ${dd!=null&&dd>7?"velho":""}">${at}${ok?`<i class="rz-ok">${svgI('<path d="M5 12l5 5L20 7"/>',11)}</i>`:""}${tot==null?` · <button class="copy" data-act="ct-nova">adicionar</button>`:""}</span>
    <div class="rz-sd-b"><div><span class="rz-sd-l">${proj!=null?"Saldo projetado (fim do mês)":P.atual?"Previsão de fechamento do mês":"Sobrou no mês"}</span><b class="rz-sd-p">${proj!=null?rzV(proj):rzV(P.atual?P.fecha:P.E-P.O)}</b></div>

}
function vRzReceb(){
  const ag=rzAgenda(), iProx=ag.findIndex(x=>!x.rec);
  const tl=ag.length?`<div class="rz-tl" style="--n:${ag.length}">${ag.map((x,k)=>{ const c=x.rec?"ok":k===iProx?(x.atr?"atr":"prox"):"fut";

  </section>`;
}
function vRzMes(G,P){
  const hoje=todayISO(), ym=G.ym, dim=daysIn(ym), mA=hoje.slice(0,7), mes=S.gPer==="mes";
  const pct=!mes?1:ym<mA?1:ym>mA?0:(+hoje.slice(8,10))/dim, falta=mes&&ym===mA?dim-(+hoje.slice(8,10)):0;
  const R=46, C=2*Math.PI*R;
  const linha=(cl,ic,n,v)=>`<div class="rz-ml ${cl}"><span class="rz-mi">${svgI(ic,16)}</span><span>${n}</span><b>${rzV(v)}</b></div>`;
  const prev=P.atual||ym>mA;
  return `<section class="card rz-card rz-mes" aria-label="Resumo do mês">
    <div class="rz-pg"><h3>Progresso do mês</h3>
      <div class="rz-ring"><svg viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="${R}" class="bg"/><circle cx="55" cy="55" r="${R}" class="fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}"/></svg>
        <div><b>${Math.round(pct*100)}%</b><small>${mes?"do mês concluído":"do período"}</small></div></div>
      <small class="rz-pg-s">${!mes?esc(G.P.label):ym<mA?"Mês encerrado":ym>mA?"Mês ainda não começou":falta===0?"Último dia do mês":`Faltam ${falta} dia${falta>1?"s":""} para o fim do mês`}</small></div>
    <div class="rz-rs"><h3>${prev?"Previsão do mês":"Resumo do mês"}</h3>

      ${linha("out",'<path d="M12 5v14M5 12l7 7 7-7"/>',"Saídas",prev?P.gastoFim:P.O)}
      ${linha("sd",'<path d="M21 12a9 9 0 1 1-9-9v9z"/>',prev?"Sobra":"Sobrou",prev?P.fecha:P.E-P.O)}
      <button class="rz-ext" data-act="gp-ir" data-v="0">Ver extrato completo${svgI('<path d="M9 6l6 6-6 6"/>',16)}</button></div>
  </section>`;
}
function vAnaliseTopo(G,avs){
  const P=rzPrev(G), lim=S.gPer==="mes"?vLimGerais(limGeraisStatus(G.ym)):"";

function vContas(){

      ${S.ctDel===c.id?`<span class="ct-conf">Remover esta conta? <button class="btn sm danger" data-act="ct-del-ok" data-id="${c.id}">Sim</button><button class="btn sm" data-act="ct-del-no">Não</button></span>`

          <input class="inp money" id="ctaj_v" inputmode="decimal" placeholder="Valor, ex.: 22,00" required aria-label="Valor">

    <div class="ct-head"><span class="eyebrow">Dinheiro em conta</span>${S.ctNova?"":`<button class="ct-add-b ${cs.length?"":"forte"}" data-act="ct-nova" aria-label="Adicionar conta bancária"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Adicionar conta</button>`}</div>

      ${cs.length||S.ctNova?`<div class="ct-tiles">
      ${cs.map(tile).join("")}
      ${S.ctNova?`<form class="ct-tile edit" id="f-ct-nova" autocomplete="off"><label class="sr" for="ctn_nova">Nome da conta</label><input class="inp" id="ctn_nova" placeholder="Nome, ex.: Nubank" maxlength="30" required><label class="sr" for="ctv_nova">Saldo atual</label><input class="inp money" id="ctv_nova" inputmode="decimal" placeholder="Saldo atual" required><span class="btns"><button class="btn sm primary" type="submit">Adicionar</button><button class="btn sm" type="button" data-act="ct-cancel">Cancelar</button></span></form>`

      </div>`:`<button class="ct-vazio" data-act="ct-nova">Nenhuma conta cadastrada. Toque para adicionar a primeira.</button>`}
    </div>
    <div class="ct-col ct-col-rd"><span class="ct-sub">Recebimentos do mês</span>${vRendas()}</div>
  </section>`;

function txFechar(){ const ov=document.getElementById("tx-ov"); if(!ov||ov.hidden) return; ov.classList.remove("show"); document.body.classList.remove("gn-on"); setTimeout(()=>{ if(!ov.classList.contains("show")) ov.hidden=true; },220); }
function txRender(abrir){
  const ent=TX.k==="e", x=(ent?S.entradas:S.gastos).get(TX.id); if(!x){ txFechar(); return; }
  let ov=document.getElementById("tx-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="tx-ov"; ov.className="gn-ov"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); document.body.appendChild(ov);
    ov.addEventListener("click",async e=>{ if(e.target===ov){ txFechar(); return; } const b=e.target.closest("[data-tx]"); if(!b) return; const a=b.dataset.tx;
      const ent=TX.k==="e", x=(ent?S.entradas:S.gastos).get(TX.id); if(!x){ txFechar(); return; }
      if(a==="x") txFechar();
      else if(a==="cat"){ const v=b.dataset.v; if(v===x.cat) return; const docs=[{...x,cat:v}]; let msg=`Categoria alterada para ${ent?ecatNome(v):catNome(v)}`;
        if(!ent&&document.getElementById("tx-sempre")?.checked){ const sm=gSimilares(x); sm.mesmo.forEach(y=>docs.push({...y,cat:v})); if(sm.ch) docs.push({kind:"regra",id:"rg_"+sm.ch.replace(/[^A-Z0-9]+/g,"_"),chave:sm.ch,cat:v}); msg=`${sm.mesmo.length+1} gastos movidos para ${catNome(v)} · vale também para as próximas importações`; }

      else if(a==="editar"){ txFechar(); S.tab="gastos"; GP.pg=0; if(ent){ S.eEdit=x.id; S.gEdit=null; } else { S.gTipo="gasto"; S.eEdit=null; S.gEdit=x.id; } render(); setTimeout(()=>{ const f=document.querySelector(".g-form-card"); if(f) f.scrollIntoView({behavior:"smooth",block:"start"}); const i=document.getElementById(ent?"ed_":"gd"); if(i) i.focus({preventScroll:true}); },60); }

function gPeriodo(){

function gChave(g){ if(g.ext){ const p=g.ext.split("|"); if(p[2]) return p[2]; } return ofxNorm(g.desc).replace(/^IFOOD · /,"IFD ").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim().split(" ").slice(0,2).join(" "); }

function gCompute(){

  const prevMesTotal=P.pde?somaG(P.pde,P.pate):null;

  const dEf=S.gPer==="mes"?diasComDados(ym):null, dimM=S.gPer==="mes"?daysIn(ym):null;

  const limMes=[...S.orc.values()].reduce((a,o)=>a+(o.cat&&o.limite>0?o.limite:0),0);
  const limTotal=limMes*P.nMeses;
  const gastoComLim=Object.keys(lim).reduce((a,c)=>a+(porCat[c]||0),0);
  const cats=[...new Set([...Object.keys(porCat),...Object.keys(lim)])].sort((a,b)=>(porCat[b]||0)-(porCat[a]||0)||(lim[b]||0)-(lim[a]||0));
  const fimEf=P.ate<P.hoje?P.ate:P.hoje; const dias=parcial?dEf:P.de<=fimEf?diasEntre(P.de,fimEf):0;

  else { let m0=P.de.slice(0,7), m1=P.ate.slice(0,7); while(meses.length<60 && m0<=m1){ meses.push(m0); m0=ymAdd(m0,1); } while(meses.length<6) meses.unshift(ymAdd(meses[0]||P.mesAtual,-1)); if(meses.length>36) meses=meses.slice(-36); }
  const porMes={}; all.forEach(g=>{ const m=g.data.slice(0,7); porMes[m]=(porMes[m]||0)+g.valor; });
  meses=meses.map(m=>({ym:m,total:porMes[m]||0,dentro:m>=P.de.slice(0,7)&&m<=P.ate.slice(0,7)}));
  const prevYm=ymAdd(ym,-1);
  const fixosPrev=S.gPer!=="mes"?[]:all.filter(g=>g.fixo&&g.data.startsWith(prevYm)).filter(f=>!doPer.some(g=>g.desc.toLowerCase()===f.desc.toLowerCase()&&g.cat===f.cat));
  const lojas={}; doPer.forEach(g=>{ const k=g.desc.trim().toLowerCase(); const x=(lojas[k] ||= {desc:g.desc,n:0,v:0,cat:{}}); x.n++; x.v+=g.valor; x.cat[g.cat]=(x.cat[g.cat]||0)+1; });

  // lista com filtros

function luz(hex){ const h=hex.replace("#",""); if(h.length<6) return 0; const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255); return .2126*r+.7152*g+.0722*b; }
function treemapHtml(G){
  const itens=Object.entries(G.porCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([c,v])=>({c,v}));
  const out=[];
  const split=(arr,x,y,w,h)=>{
    if(!arr.length) return;
    if(arr.length===1){ out.push({...arr[0],x,y,w,h}); return; }
    const tot=arr.reduce((s,a)=>s+a.v,0); let acc=0,k=0;
    while(k<arr.length-1 && acc+arr[k].v<=tot/2){ acc+=arr[k].v; k++; } if(k===0){ acc=arr[0].v; k=1; }
    const A=arr.slice(0,k), B=arr.slice(k), f=acc/tot;

  };

}

async function gSubmit(){
  const desc=document.getElementById("gd").value.trim();
  const valor=parseNum(document.getElementById("gv").value);
  const data=document.getElementById("gdt").value;
  if(!desc){ toast("Informe a descrição do gasto."); return; }
  if(valor==null||valor<=0){ toast("Informe um valor maior que zero, como 59,90."); return; }
  if(!data){ toast("Informe a data do gasto."); return; }
  const base=S.gEdit?S.gastos.get(S.gEdit):null;
  const doc={...(base||{}),kind:"gasto",id:base?base.id:"g_"+uid(),desc,valor:Math.round(valor*100)/100,data,
    cat:document.getElementById("gc").value,pag:document.getElementById("gp").value,fixo:document.getElementById("gf").checked,criado:base?base.criado:Date.now()};
  const gco=document.getElementById("gco"); if(gco) doc.conta=gco.value;
  const editou=!!base; S.gEdit=null;
  let extras=[], regra=null;
  if(base){
    const sc=(document.querySelector('input[name="gscope"]:checked')||{}).value||"este";
    if(sc!=="este"){ const sm=gSimilares(base); const alvo=sc==="mesmo"?sm.mesmo:sm.contem;
      extras=alvo.filter(x=>x.cat!==doc.cat).map(x=>({...x,cat:doc.cat}));
      regra=sc==="mesmo"?{kind:"regra",id:"rg_"+sm.ch.replace(/[^A-Z0-9]+/g,"_"),chave:sm.ch,cat:doc.cat}:{kind:"regra",id:"rgc_"+ofxNorm(sm.termo).replace(/[^A-Z0-9]+/g,"_"),termo:ofxNorm(sm.termo),cat:doc.cat};
    }
  }
  if(!data.startsWith(S.gMes)) S.gMes=data.slice(0,7);
  if(extras.length||regra){ await safe(store.putMany([doc,...extras,...(regra?[regra]:[])]), `${extras.length+1} gasto(s) atualizado(s) para ${catNome(doc.cat)}`); }
  else await safe(store.put(doc), editou?"Gasto atualizado":`Gasto de ${fmt(doc.valor)} lançado`);
  render();
  if(!editou){ const f=document.getElementById("gd"); if(f) f.focus(); }
}
async function gSalvarOrc(){
  const vals=GCATS.map(([id])=>[id,document.getElementById("o_"+id).value.trim()]);
  const gers=LGER.map(([t])=>[t,document.getElementById("og_"+t).value.trim()]);
  if([...vals,...gers].some(([,raw])=>raw && (parseNum(raw)==null||parseNum(raw)<0))){ toast("Confira os limites: use números como 800,00."); return; }
  S.gOrcOpen=false;
  const jobs=[];
  for(const [id,raw] of vals){
    const cur=S.orc.get("orc_"+id), v=raw?Math.round(parseNum(raw)*100)/100:null;
    if(v==null||v===0){ if(cur) jobs.push(()=>store.del(cur.id)); }
    else if(!cur||cur.limite!==v) jobs.push(()=>store.put({kind:"orc",id:"orc_"+id,cat:id,limite:v}));
  }
  for(const [t,raw] of gers){
    const cur=S.orc.get("orcg_"+t), v=raw?Math.round(parseNum(raw)*100)/100:null;
    if(v==null||v===0){ if(cur) jobs.push(()=>store.del(cur.id)); }
    else if(!cur||cur.limite!==v) jobs.push(()=>store.put({kind:"orc",id:"orcg_"+t,geral:t,limite:v}));
  }
  await safe(Promise.all(jobs.map(f=>f())),"Limites salvos"); render();
}
async function gLancarFixos(){
  const G=gCompute(); const dim=daysIn(G.ym);
  const ops=G.fixosPrev.map(f=>{ const dia=Math.min(+f.data.slice(8,10),dim); return store.put({...f,id:"g_"+uid(),data:`${G.ym}-${String(dia).padStart(2,"0")}`,criado:Date.now()}); });
  await safe(Promise.all(ops),`${ops.length} gasto(s) fixo(s) lançado(s)`); render();
}

  const d=S.entryDate; const ops=[]; let bad=false; const C=compute();
  for(const a of S.assets.values()){
    const dr=S.drafts[a.id]; if(!dr) continue;
    if(C.pais.has(a.id)){
      const G=grpEstado(C,a.id,d);
      const T=parseNum(dr.saldo ?? (G.exTot!=null?String(G.exTot):""));
      const A=parseNum(dr.aporte ?? (G.exAp!=null?String(G.exAp):""))||0;
      if(T==null){ if(dr.saldo && dr.saldo.trim()) bad=true; continue; }
      if(T<0){ bad=true; continue; }
      // distribui o total entre as subcategorias, na proporção do último saldo de cada uma
      const base=G.itens.map(x=>x.prev?x.prev.saldo:0), P0=base.reduce((x,y)=>x+y,0);
      const pesos=P0>0?base.map(v=>v/P0):G.itens.map((x,k)=>k===0?1:0);
      const r2=v=>Math.round(v*100)/100;
      const saldos=pesos.map(w=>r2(T*w)), aps=pesos.map(w=>r2(A*w));
      const big=pesos.indexOf(Math.max(...pesos));
      saldos[big]=r2(saldos[big]+(r2(T)-saldos.reduce((x,y)=>x+y,0)));
      aps[big]=r2(aps[big]+(r2(A)-aps.reduce((x,y)=>x+y,0)));
      G.itens.forEach((x,k)=>{ if(P0>0 && !x.prev && pesos[k]===0) return; ops.push(store.put({kind:"lanc",id:`l_${x.f.id}_${d}`,ativo:x.f.id,data:d,saldo:saldos[k],aporte:aps[k],viaTotal:true})); });
      continue;
    }
    const ex=S.entries.get(`l_${a.id}_${d}`);
    const s=parseNum(dr.saldo ?? (ex?String(ex.saldo).replace(".",","):""));
    const ap=parseNum(dr.aporte ?? (ex?String(ex.aporte||"").replace(".",","):""))||0;
    if(dr.saldo!==undefined && dr.saldo.trim()==="" && ex){ ops.push(store.del(ex.id)); continue; }
    if(s==null){ if(dr.saldo && dr.saldo.trim()) bad=true; continue; }
    if(s<0){ bad=true; continue; }
    ops.push(store.put({kind:"lanc",id:`l_${a.id}_${d}`,ativo:a.id,data:d,saldo:Math.round(s*100)/100,aporte:Math.round(ap*100)/100}));
  }
  if(bad){ toast("Confira os valores: use números como 1.234,56."); return; }
  if(!ops.length){ toast("Preencha o saldo de pelo menos um ativo."); return; }
  S.drafts={};
  await safe(Promise.all(ops), `${ops.length} lançamento(s) salvo(s) em ${dBR(d)}`);
  render();
}

async function loadExample(){
  const end=todayISO(), start=addDays(end,-300);
  const defs=[["Tesouro Selic 2029","Tesouro Direto","Tesouro",18000,0.00045,0.0003],["CDB 110% CDI","Renda Fixa","Banco",22000,0.0005,0.0004],
    ["Ações — carteira","Ações","Corretora",12000,0.0004,0.012],["FIIs — carteira","Fundos Imobiliários","Corretora",9000,0.0003,0.006]];
  const docs=[]; let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  defs.forEach((df,i)=>{
    const id="a_ex"+i; docs.push({kind:"ativo",id,nome:df[0],classe:df[1],inst:df[2],cor:i,ordem:i,ex:true});
    let v=df[3];
    for(let d=start, k=0; d<=end; d=addDays(d,7), k++){
      let ap=0;
      if(k>0){ const g=(df[4]*7)+(rnd()-0.48)*df[5]*Math.sqrt(7); v*=1+g; if(k%4===0){ ap=[800,1000,500,400][i]; v+=ap; } }
      docs.push({kind:"lanc",id:`l_${id}_${d}`,ativo:id,data:d,saldo:Math.round(v*100)/100,aporte:ap,ex:true});
    }
  });
  if(store.mode==="local"){ docs.forEach(x=>(x.kind==="ativo"?S.assets:S.entries).set(x.id,x)); lsSave(); render(); toast("Dados de exemplo carregados"); return; }
  toast("Carregando exemplo…");
  for(let i=0;i<docs.length;i+=25) await safe(Promise.all(docs.slice(i,i+25).map(x=>store.put(x))));
  toast("Dados de exemplo carregados");
}
async function clearExample(){
  const ids=[...S.assets.values(),...S.entries.values()].filter(x=>x.ex).map(x=>x.id);
  if(store.mode==="local"){ ids.forEach(id=>{S.assets.delete(id);S.entries.delete(id);}); lsSave(); render(); toast("Exemplo removido"); return; }
  for(let i=0;i<ids.length;i+=25) await safe(Promise.all(ids.slice(i,i+25).map(id=>store.del(id))));
  toast("Exemplo removido");
}

async function exportCSV(kind){
  const C=compute(); const n=v=>String((Math.round((v||0)*100)/100).toFixed(2)).replace(".",",");
  let rows, name;
  if(kind==="mes"){ name="relatorio-mensal.csv"; rows=[["Mês","Saldo inicial","Aportes/Resgates","Rendimento","Saldo final","Rentabilidade %"],...C.months.map(m=>[mLong(m.ym),n(m.ini),n(m.aportes),n(m.ganho),n(m.fim),n(m.rent*100)])]; }
  else if(kind==="pos"){ name="posicao-por-ativo.csv"; rows=[["Ativo","Classe","Instituição","Saldo atual","Aplicado","Resultado","Rentabilidade %"],...C.perAsset.map(p=>[nomeCompleto(p.a),p.a.classe,p.a.inst||"",n(p.valor),n(p.investido),n(p.lucro),isFinite(p.rent)?n(p.rent*100):""])]; }
  else if(kind==="gastos"){ const G=gCompute(); name=`gastos-${G.P.de}-a-${G.P.ate}.csv`; rows=[["Data","Descrição","Categoria","Pagamento","Fixo","Valor"],...(S.gOrd==="recentes"?G.lista.slice().reverse():G.lista).map(g=>[dBR(g.data),g.desc,catNome(g.cat),g.pag,g.fixo?"Sim":"Não",n(g.valor)])]; }
  else { name="historico-lancamentos.csv"; rows=[["Data","Ativo","Saldo","Aporte/Resgate"],...[...S.entries.values()].filter(e=>ativoVisivel(e.ativo)).sort((a,b)=>a.data.localeCompare(b.data)).map(e=>[dBR(e.data),nomeCompleto(S.assets.get(e.ativo)),n(e.saldo),n(e.aporte)])]; }
  const text="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  await salvarArquivo(name,new Blob([text],{type:"text/csv;charset=utf-8"}));
}
/* salva um arquivo: pelo Claude quando o site abre lá; senão, download comum do navegador (app instalado) */
async function salvarArquivo(name,blob){
  let dl=null; try{ dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; }catch{}
  if(dl){ try{ await dl.save({filename:name,data:blob}); return true; }catch(e){ if(e&&e.code==="declined"){ toast("Exportação cancelada."); return false; } } }
  try{ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return true; }
  catch{ toast("Não foi possível salvar o arquivo neste aparelho."); return false; }
}
